
{% extends 'base.html' %}

{% block content %}

<!-- ========================================= -->
<!-- 1. CONSULTATION TYPES SECTION              -->
<!-- ========================================= -->

<section>

    <h2>Consultation types</h2>


    <!-- ========================================= -->
    <!-- 2. EXISTING CONSULTATIONS TABLE          -->
    <!-- ========================================= -->

    <table>

        <!-- Table Headers -->
        <thead>
            <tr>
                <th>Type</th>
                <th>Minutes</th>
                <th>Fee</th>
                <th>Capacity</th>
                <th></th>
            </tr>
        </thead>


        <!-- Table Body -->
        <tbody>

            {% for item in items %}

            <tr>

                <!-- Consultation Name -->
                <td>
                    {{ item.name }}
                </td>

                <!-- Consultation Duration -->
                <td>
                    {{ item.duration_minutes }}
                </td>

                <!-- Consultation Fee -->
                <td>
                    {{ item.fee }}
                </td>

                <!-- Consultation Capacity -->
                <td>
                    {{ item.capacity }}
                </td>


                <!-- Edit populates the form below; the database ID stays internal. -->
                <td>
                    <button
                        type="button"
                        class="edit-consultation"
                        data-id="{{ item.consultation_type_id }}"
                        data-name="{{ item.name }}"
                        data-fee="{{ item.fee }}"
                        data-capacity="{{ item.capacity }}"
                    >Edit</button>

                    <form method="post" style="display:inline">

                        <!-- CSRF protection -->
                        <input
                            type="hidden"
                            name="csrf_token"
                            value="{{ csrf_token() }}"
                        >

                        <!-- Delete selected consultation -->
                        <button
                            name="delete_id"
                            value="{{ item.consultation_type_id }}"
                        >
                            Delete
                        </button>

                    </form>

                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>


    <!-- ========================================= -->
    <!-- 4. CREATE / UPDATE CONSULTATION FORM      -->
    <!-- ========================================= -->

    <h3 id="consult-form-heading">Create consultation</h3>

    <form method="post" id="consult-form">

        <!-- CSRF token for form security -->
        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >


        <!-- ========================================= -->
        <!-- 5. CONSULTATION INPUT FIELDS              -->
        <!-- ========================================= -->

        <!-- Internal ID used only when editing; doctors never type IDs. -->
        <input type="hidden" name="item_id" id="consult-item-id" value="">

        <!-- Consultation Type Selection -->
        <label>
            Consultation type

            <select
                name="name"
                id="consult-type"
            >

                <!-- Quick Consultation -->
                <option
                    value="Quick Consult"
                    data-duration="15"
                    data-min="1"
                    data-max="1"
                >
                    Quick Consult
                </option>


                <!-- Standard Consultation -->
                <option
                    value="Standard Consult"
                    data-duration="30"
                    data-min="1"
                    data-max="1"
                >
                    Standard Consult
                </option>


                <!-- Detailed Consultation -->
                <option
                    value="Detailed Consult"
                    data-duration="45"
                    data-min="1"
                    data-max="1"
                >
                    Detailed Consult
                </option>


                <!-- Health Camp Session -->
                <option
                    value="Health Camp Session"
                    data-duration="60"
                    data-min="2"
                    data-max="10"
                >
                    Health Camp
                </option>

            </select>
        </label>


        <!-- Consultation Duration -->
        <!-- Automatically updated based on consultation type -->
        <label>
            Duration (automatically selected)

            <input
                id="consult-duration"
                value="15 minutes"
                readonly
            >
        </label>


        <!-- Consultation Fee -->
        <label>
            Fee

            <input
                name="fee"
                type="number"
                step="0.01"
                min="0"
                required
            >
        </label>


        <!-- Consultation Capacity -->
        <label>
            Capacity

            <input
                name="capacity"
                id="consult-capacity"
                type="number"
                min="1"
                max="1"
                value="1"
                required
            >
        </label>


        <!-- Capacity Information -->
        <p
            id="capacity-help"
            class="hint"
        >
            One patient per slot
        </p>


        <!-- ========================================= -->
        <!-- 6. SAVE CONSULTATION BUTTON               -->
        <!-- ========================================= -->

        <button type="submit" id="consult-submit">
            Create consultation
        </button>
        <button type="button" id="consult-cancel" style="display:none">
            Cancel edit
        </button>

    </form>

</section>


<!-- ========================================= -->
<!-- 7. JAVASCRIPT: DYNAMIC CONSULTATION FIELDS -->
<!-- ========================================= -->

<script>

    // Get consultation form elements
    const sel = document.getElementById('consult-type');
    const dur = document.getElementById('consult-duration');
    const cap = document.getElementById('consult-capacity');
    const help = document.getElementById('capacity-help');


    /*
     * Update Consultation Fields
     *
     * Automatically updates:
     * - Duration
     * - Minimum capacity
     * - Maximum capacity
     * - Default capacity
     * - Capacity help message
     *
     * Based on the selected consultation type.
     */
    function updateConsult() {

        // Get selected consultation option
        const o = sel.selectedOptions[0];

        // Read minimum and maximum capacity
        const min = Number(o.dataset.min);
        const max = Number(o.dataset.max);

        // Update consultation duration
        dur.value = o.dataset.duration + ' minutes';

        // Update capacity limits
        cap.min = min;
        cap.max = max;

        // Set default capacity
        cap.value = min;

        // Make capacity read-only when fixed
        cap.readOnly = min === max;

        // Display capacity instructions
        help.textContent = min === max
            ? 'Capacity fixed at 1'
            : `Choose between ${min} and ${max} patients`;

    }


    const itemId = document.getElementById('consult-item-id');
    const fee = document.querySelector('#consult-form [name="fee"]');
    const heading = document.getElementById('consult-form-heading');
    const submit = document.getElementById('consult-submit');
    const cancel = document.getElementById('consult-cancel');

    function resetEdit() {
        itemId.value = '';
        document.getElementById('consult-form').reset();
        updateConsult();
        heading.textContent = 'Create consultation';
        submit.textContent = 'Create consultation';
        cancel.style.display = 'none';
    }

    document.querySelectorAll('.edit-consultation').forEach(button => {
        button.addEventListener('click', () => {
            const option = Array.from(sel.options).find(o => o.value === button.dataset.name);
            if (!option) {
                alert('This consultation type cannot be edited using the available presets.');
                return;
            }
            itemId.value = button.dataset.id;
            sel.value = button.dataset.name;
            updateConsult();
            fee.value = button.dataset.fee;
            cap.value = button.dataset.capacity;
            heading.textContent = 'Edit consultation';
            submit.textContent = 'Save changes';
            cancel.style.display = '';
            document.getElementById('consult-form-heading').scrollIntoView({behavior:'smooth'});
        });
    });
    cancel.addEventListener('click', resetEdit);

    // Update fields when consultation type changes
    sel.addEventListener('change', updateConsult);


    // Initialize fields when the page loads
    updateConsult();

</script>

{% endblock %}
