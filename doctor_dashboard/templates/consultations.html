{% extends 'base.html' %}{% block content %}<section><h2>Consultation types</h2><table><tr><th>ID</th><th>Type</th><th>Minutes</th><th>Fee</th><th>Capacity</th><th></th></tr>{% for item in items %}<tr><td>{{ item.consultation_type_id }}</td><td>{{ item.name }}</td><td>{{ item.duration_minutes }}</td><td>{{ item.fee }}</td><td>{{ item.capacity }}</td><td><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button name="delete_id" value="{{ item.consultation_type_id }}">Delete</button></form></td></tr>{% endfor %}</table><h3>Create / update</h3><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Existing ID (blank to create)<input name="item_id" type="number" min="1"></label><label>Type<select name="name"><option>Quick Consult</option><option>Standard Consult</option><option>Detailed Consult</option><option>Health Camp Session</option></select></label><label>Duration (15, 30 or 60)<input name="duration_minutes" type="number" required></label><label>Fee<input name="fee" type="number" step="0.01" min="0" required></label><label>Capacity<input name="capacity" type="number" min="1" max="10" required></label><button>Save</button></form></section>{% endblock %}
