{% extends 'base.html' %}{% block content %}<section><h2>My profile</h2><p>Licence: {{ data.licence_number }} · {{ data.email }}</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% for field in ['name','specialization','experience_years','qualifications','hospital_name','clinic_address','city'] %}<label>{{ field.replace('_',' ').title() }}<input name="{{ field }}" value="{{ data.get(field,'') }}" {% if field=='experience_years' %}type="number" min="0" max="80"{% endif %} required></label>{% endfor %}<label>Languages (comma-separated)<input name="languages" value="{{ (data.languages or [])|join(', ') }}" required></label><button>Save profile</button></form><h3>Profile photo</h3><form method="post" action="/doctor/photo" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Photo (JPEG, PNG, WebP; max 5 MB)<input type="file" name="photo" accept="image/jpeg,image/png,image/webp" required></label><button>Upload photo</button></form></section>{% endblock %}
