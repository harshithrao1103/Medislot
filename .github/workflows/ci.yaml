name: MediSlot CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and IaC validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation tools
        run: python -m pip install -r tests/requirements.txt
      - name: Compile Python
        run: python -m compileall -q lambdas tests doctor_dashboard
      - name: CloudFormation lint and security scan
        run: |
          cfn-lint Cloudformation/*.yaml
          checkov -d Cloudformation --framework cloudformation --quiet
      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  unit-tests:
    name: Unit and regression tests
    runs-on: ubuntu-latest
    needs: [lint]
    env:
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Run unit and regression tests
        run: python -m pytest -q tests/test_*.py

  integration-contract-tests:
    name: Integration contract tests
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Validate cross-component Milestone 6 contracts
        run: python -m pytest -q tests/integration
