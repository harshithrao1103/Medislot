name: MediSlot Infrastructure Deployment

# =====================================================
# WORKFLOW TRIGGERS
# =====================================================

on:
  push:
    branches:
      - main
    paths:
      - "Cloudformation/**"
      - "database/**"
      - "lambdas/**"
      - "scripts/**"
      - ".github/workflows/deploy.yaml"

  workflow_dispatch:

# =====================================================
# GITHUB PERMISSIONS
# =====================================================

permissions:
  id-token: write
  contents: read

# =====================================================
# JOBS
# =====================================================

jobs:

  # =====================================================
  # JOB 1: DEPLOY NETWORK STACK
  # =====================================================

  deploy-network:
    name: Deploy Network Stack
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. CHECKOUT REPOSITORY
      # =====================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # =====================================================
      # 2. LOAD CONFIGURATION FROM PARAMETERS.JSON
      # =====================================================

      - name: Load Configuration
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="Cloudformation/parameters.json"

          jq -e . "$CONFIG" > /dev/null

          PROJECT=$(jq -er '.project' "$CONFIG")
          DEPLOY_ENV=$(jq -er '.environment' "$CONFIG")
          AWS_REGION=$(jq -er '.region' "$CONFIG")

          if [[ ! "$PROJECT" =~ ^[a-z][a-z0-9-]*$ ]]; then
            echo "::error::Invalid project name"
            exit 1
          fi

          if [[ ! "$DEPLOY_ENV" =~ ^(dev|staging|prod)$ ]]; then
            echo "::error::Invalid environment"
            exit 1
          fi

          if [[ -z "$AWS_REGION" ]]; then
            echo "::error::AWS Region is required"
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "DEPLOY_ENV=$DEPLOY_ENV" >> "$GITHUB_ENV"
          echo "AWS_REGION=$AWS_REGION" >> "$GITHUB_ENV"

          echo "STACK_NAME=${PROJECT}-${DEPLOY_ENV}-network" >> "$GITHUB_ENV"

          jq -e '
            .network |
            [
              .VpcCIDR,
              .PublicSubnetCIDR,
              .PrivateSubnetACIDR,
              .PrivateSubnetBCIDR,
              .AvailabilityZoneA,
              .AvailabilityZoneB
            ] |
            all(. != null and type == "string" and length > 0)
          ' "$CONFIG" > /dev/null

          AZ_A=$(jq -r '.network.AvailabilityZoneA' "$CONFIG")
          AZ_B=$(jq -r '.network.AvailabilityZoneB' "$CONFIG")

          if [[ "$AZ_A" == "$AZ_B" ]]; then
            echo "::error::Availability Zones must be different"
            exit 1
          fi

          if [[ "$AZ_A" != "$AWS_REGION"* || "$AZ_B" != "$AWS_REGION"* ]]; then
            echo "::error::Availability Zones must belong to the configured region"
            exit 1
          fi

          echo "Configuration loaded successfully"

      # =====================================================
      # 3. CONFIGURE AWS CREDENTIALS USING OIDC
      # =====================================================

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # =====================================================
      # 4. VERIFY AWS IDENTITY
      # =====================================================

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      # =====================================================
      # 5. RESOLVE CLOUDFORMATION EXECUTION ROLE
      # =====================================================

      - name: Resolve CloudFormation Execution Role
        shell: bash
        run: |
          set -euo pipefail

          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          PARTITION=$(aws sts get-caller-identity \
            --query Arn \
            --output text | cut -d: -f2)

          ROLE_NAME="medislot_cloudformation_execution"

          ROLE_ARN="arn:${PARTITION}:iam::${ACCOUNT_ID}:role/${ROLE_NAME}"

          echo "CFN_EXECUTION_ROLE_ARN=$ROLE_ARN" >> "$GITHUB_ENV"

          echo "CloudFormation execution role resolved"

      # =====================================================
      # 6. VALIDATE NETWORK TEMPLATE
      # =====================================================

      - name: Validate Network Template
        shell: bash
        run: |
          set -euo pipefail

          aws cloudformation validate-template \
            --template-body file://Cloudformation/Network_Stack.yaml \
            --region "$AWS_REGION"

      # =====================================================
      # 7. DEPLOY NETWORK STACK
      # =====================================================

      - name: Deploy Network Stack
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="Cloudformation/parameters.json"

          VPC_CIDR=$(jq -r '.network.VpcCIDR' "$CONFIG")
          PUBLIC_SUBNET_CIDR=$(jq -r '.network.PublicSubnetCIDR' "$CONFIG")
          PRIVATE_SUBNET_A_CIDR=$(jq -r '.network.PrivateSubnetACIDR' "$CONFIG")
          PRIVATE_SUBNET_B_CIDR=$(jq -r '.network.PrivateSubnetBCIDR' "$CONFIG")
          AZ_A=$(jq -r '.network.AvailabilityZoneA' "$CONFIG")
          AZ_B=$(jq -r '.network.AvailabilityZoneB' "$CONFIG")

          aws cloudformation deploy \
            --template-file Cloudformation/Network_Stack.yaml \
            --stack-name "$STACK_NAME" \
            --parameter-overrides \
              Environment="$DEPLOY_ENV" \
              VpcCIDR="$VPC_CIDR" \
              PublicSubnetCIDR="$PUBLIC_SUBNET_CIDR" \
              PrivateSubnetACIDR="$PRIVATE_SUBNET_A_CIDR" \
              PrivateSubnetBCIDR="$PRIVATE_SUBNET_B_CIDR" \
              AvailabilityZoneA="$AZ_A" \
              AvailabilityZoneB="$AZ_B" \
            --role-arn "$CFN_EXECUTION_ROLE_ARN" \
            --region "$AWS_REGION" \
            --no-fail-on-empty-changeset

      # =====================================================
      # 8. DISPLAY NETWORK STACK OUTPUTS
      # =====================================================

      - name: Display Network Stack Outputs
        shell: bash
        run: |
          set -euo pipefail

          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs" \
            --region "$AWS_REGION"

  # =====================================================
  # JOB 2: DEPLOY SECURITY IAM STACK
  # =====================================================

  deploy-security-iam:
    name: Deploy Security IAM Stack
    runs-on: ubuntu-latest

    needs:
      - deploy-network

    steps:

      # =====================================================
      # 1. CHECKOUT REPOSITORY
      # =====================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # =====================================================
      # 2. LOAD CONFIGURATION
      # =====================================================

      - name: Load Configuration
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="Cloudformation/parameters.json"

          jq -e . "$CONFIG" > /dev/null

          PROJECT=$(jq -er '.project' "$CONFIG")
          DEPLOY_ENV=$(jq -er '.environment' "$CONFIG")
          AWS_REGION=$(jq -er '.region' "$CONFIG")
          VPC_CIDR=$(jq -er '.network.VpcCIDR' "$CONFIG")

          if [[ ! "$PROJECT" =~ ^[a-z][a-z0-9-]*$ ]]; then
            echo "::error::Invalid project name"
            exit 1
          fi

          if [[ ! "$DEPLOY_ENV" =~ ^(dev|staging|prod)$ ]]; then
            echo "::error::Invalid environment"
            exit 1
          fi

          if [[ -z "$AWS_REGION" || -z "$VPC_CIDR" ]]; then
            echo "::error::Missing AWS Region or VPC CIDR"
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "DEPLOY_ENV=$DEPLOY_ENV" >> "$GITHUB_ENV"
          echo "AWS_REGION=$AWS_REGION" >> "$GITHUB_ENV"
          echo "VPC_CIDR=$VPC_CIDR" >> "$GITHUB_ENV"

          echo "STACK_NAME=${PROJECT}-${DEPLOY_ENV}-security-iam" >> "$GITHUB_ENV"

          echo "Security configuration loaded successfully"

      # =====================================================
      # 3. CONFIGURE AWS CREDENTIALS
      # =====================================================

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # =====================================================
      # 4. VERIFY AWS IDENTITY
      # =====================================================

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      # =====================================================
      # 5. RESOLVE CLOUDFORMATION EXECUTION ROLE
      # =====================================================

      - name: Resolve CloudFormation Execution Role
        shell: bash
        run: |
          set -euo pipefail

          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          PARTITION=$(aws sts get-caller-identity \
            --query Arn \
            --output text | cut -d: -f2)

          ROLE_NAME="medislot_cloudformation_execution"

          ROLE_ARN="arn:${PARTITION}:iam::${ACCOUNT_ID}:role/${ROLE_NAME}"

          echo "CFN_EXECUTION_ROLE_ARN=$ROLE_ARN" >> "$GITHUB_ENV"

          echo "CloudFormation execution role resolved"

      # =====================================================
      # 6. VALIDATE SECURITY IAM TEMPLATE
      # =====================================================

      - name: Validate Security IAM Template
        shell: bash
        run: |
          set -euo pipefail

          aws cloudformation validate-template \
            --template-body file://Cloudformation/Security_IAM_Stack.yaml \
            --region "$AWS_REGION"

      # =====================================================
      # 7. DEPLOY SECURITY IAM STACK
      # =====================================================

      - name: Deploy Security IAM Stack
        shell: bash
        run: |
          set -euo pipefail

          aws cloudformation deploy \
            --template-file Cloudformation/Security_IAM_Stack.yaml \
            --stack-name "$STACK_NAME" \
            --parameter-overrides \
              Environment="$DEPLOY_ENV" \
              VpcCIDR="$VPC_CIDR" \
            --capabilities CAPABILITY_NAMED_IAM \
            --role-arn "$CFN_EXECUTION_ROLE_ARN" \
            --region "$AWS_REGION" \
            --no-fail-on-empty-changeset

      # =====================================================
      # 8. DISPLAY SECURITY IAM STACK OUTPUTS
      # =====================================================

      - name: Display Security IAM Stack Outputs
        shell: bash
        run: |
          set -euo pipefail

          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs" \
            --region "$AWS_REGION"

  # =====================================================
  # JOB 3: DEPLOY DATA STACK
  # =====================================================

  deploy-data:
    name: Deploy Data Stack
    runs-on: ubuntu-latest

    needs:
      - deploy-security-iam

    steps:

      # =====================================================
      # 1. CHECKOUT REPOSITORY
      # =====================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # =====================================================
      # 2. LOAD DATA CONFIGURATION
      # =====================================================

      - name: Load Data Configuration
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="Cloudformation/parameters.json"

          jq -e . "$CONFIG" > /dev/null

          PROJECT=$(jq -er '.project' "$CONFIG")
          DEPLOY_ENV=$(jq -er '.environment' "$CONFIG")
          AWS_REGION=$(jq -er '.region' "$CONFIG")

          if [[ ! "$PROJECT" =~ ^[a-z][a-z0-9-]*$ ]]; then
            echo "::error::Invalid project name"
            exit 1
          fi

          if [[ ! "$DEPLOY_ENV" =~ ^(dev|staging|prod)$ ]]; then
            echo "::error::Invalid environment"
            exit 1
          fi

          if [[ -z "$AWS_REGION" ]]; then
            echo "::error::AWS Region is required"
            exit 1
          fi

          jq -e '
            .data as $d |
            ($d.DBInstanceClass | type == "string" and length > 0) and
            ($d.DBAllocatedStorage | type == "number" and . >= 20) and
            ($d.DBBackupRetentionDays | type == "number" and . >= 0 and . <= 35) and
            ($d.JWTAccessTokenMinutes | type == "number" and . >= 1) and
            ($d.RefreshTokenDays | type == "number" and . >= 1) and
            ($d.BcryptWorkFactor | type == "number" and . >= 12) and
            ($d.WaitlistHoldMinutes | type == "number" and . >= 1)
          ' "$CONFIG" > /dev/null || {
            echo "::error::Invalid or missing data configuration"
            exit 1
          }

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "DEPLOY_ENV=$DEPLOY_ENV" >> "$GITHUB_ENV"
          echo "AWS_REGION=$AWS_REGION" >> "$GITHUB_ENV"

          echo "STACK_NAME=${PROJECT}-${DEPLOY_ENV}-data" >> "$GITHUB_ENV"

          echo "Data configuration loaded successfully"

      # =====================================================
      # 3. CONFIGURE AWS CREDENTIALS
      # =====================================================

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # =====================================================
      # 4. VERIFY AWS IDENTITY
      # =====================================================

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      # =====================================================
      # 5. RESOLVE CLOUDFORMATION EXECUTION ROLE
      # =====================================================

      - name: Resolve CloudFormation Execution Role
        shell: bash
        run: |
          set -euo pipefail

          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          PARTITION=$(aws sts get-caller-identity \
            --query Arn \
            --output text | cut -d: -f2)

          ROLE_NAME="medislot_cloudformation_execution"

          ROLE_ARN="arn:${PARTITION}:iam::${ACCOUNT_ID}:role/${ROLE_NAME}"

          echo "CFN_EXECUTION_ROLE_ARN=$ROLE_ARN" >> "$GITHUB_ENV"

          echo "CloudFormation execution role resolved"

      # =====================================================
      # 6. VALIDATE DATA TEMPLATE
      # =====================================================

      - name: Validate Data Template
        shell: bash
        run: |
          set -euo pipefail

          aws cloudformation validate-template \
            --template-body file://Cloudformation/Data_Stack.yaml \
            --region "$AWS_REGION"

      # =====================================================
      # 7. DEPLOY DATA STACK
      # =====================================================

      - name: Deploy Data Stack
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="Cloudformation/parameters.json"

          DB_CLASS=$(jq -er '.data.DBInstanceClass' "$CONFIG")
          DB_STORAGE=$(jq -er '.data.DBAllocatedStorage' "$CONFIG")
          DB_BACKUP_DAYS=$(jq -er '.data.DBBackupRetentionDays' "$CONFIG")
          ACCESS_MINUTES=$(jq -er '.data.JWTAccessTokenMinutes' "$CONFIG")
          REFRESH_DAYS=$(jq -er '.data.RefreshTokenDays' "$CONFIG")
          BCRYPT_FACTOR=$(jq -er '.data.BcryptWorkFactor' "$CONFIG")
          WAITLIST_MINUTES=$(jq -er '.data.WaitlistHoldMinutes' "$CONFIG")

          aws cloudformation deploy \
            --template-file Cloudformation/Data_Stack.yaml \
            --stack-name "$STACK_NAME" \
            --parameter-overrides \
              Environment="$DEPLOY_ENV" \
              DBInstanceClass="$DB_CLASS" \
              DBAllocatedStorage="$DB_STORAGE" \
              DBBackupRetentionDays="$DB_BACKUP_DAYS" \
              JWTAccessTokenMinutes="$ACCESS_MINUTES" \
              RefreshTokenDays="$REFRESH_DAYS" \
              BcryptWorkFactor="$BCRYPT_FACTOR" \
              WaitlistHoldMinutes="$WAITLIST_MINUTES" \
            --role-arn "$CFN_EXECUTION_ROLE_ARN" \
            --region "$AWS_REGION" \
            --no-fail-on-empty-changeset

      # =====================================================
      # 8. DISPLAY DATA STACK OUTPUTS
      # =====================================================

      - name: Display Data Stack Outputs
        shell: bash
        run: |
          set -euo pipefail

          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs" \
            --region "$AWS_REGION"

  # =====================================================
  # JOB 4: PACKAGE AND DEPLOY APPLICATION STACK
  # =====================================================

  deploy-application:
    name: Deploy Application Stack
    runs-on: ubuntu-latest

    needs:
      - deploy-data

    steps:

      # =====================================================
      # 1. CHECKOUT REPOSITORY
      # =====================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # =====================================================
      # 2. LOAD CONFIGURATION
      # =====================================================

      - name: Load Configuration
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="Cloudformation/parameters.json"

          jq -e . "$CONFIG" > /dev/null

          PROJECT=$(jq -er '.project' "$CONFIG")
          DEPLOY_ENV=$(jq -er '.environment' "$CONFIG")
          AWS_REGION=$(jq -er '.region' "$CONFIG")

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "DEPLOY_ENV=$DEPLOY_ENV" >> "$GITHUB_ENV"
          echo "AWS_REGION=$AWS_REGION" >> "$GITHUB_ENV"

          echo "STACK_NAME=${PROJECT}-${DEPLOY_ENV}-application" >> "$GITHUB_ENV"

      # =====================================================
      # 3. CONFIGURE AWS CREDENTIALS
      # =====================================================

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # =====================================================
      # 4. RESOLVE DEPLOYMENT RESOURCES
      # =====================================================

      - name: Resolve Deployment Resources
        shell: bash
        run: |
          set -euo pipefail

          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          PARTITION=$(aws sts get-caller-identity \
            --query Arn \
            --output text | cut -d: -f2)

          echo "CFN_EXECUTION_ROLE_ARN=arn:${PARTITION}:iam::${ACCOUNT_ID}:role/medislot_cloudformation_execution" >> "$GITHUB_ENV"

          ARTIFACT_BUCKET=$(aws cloudformation list-exports \
            --query "Exports[?Name=='${PROJECT}-${DEPLOY_ENV}-SAMArtifactsBucketName'].Value | [0]" \
            --output text \
            --region "$AWS_REGION")

          if [[ -z "$ARTIFACT_BUCKET" || "$ARTIFACT_BUCKET" == "None" ]]; then
            echo "::error::SAM artifacts bucket export not found"
            exit 1
          fi

          echo "ARTIFACT_BUCKET=$ARTIFACT_BUCKET" >> "$GITHUB_ENV"

          echo "Deployment resources resolved successfully"

      # =====================================================
      # 5. SET UP PYTHON 3.12
      # =====================================================

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # =====================================================
      # 6. PACKAGE LAMBDA FUNCTIONS
      # =====================================================

      - name: Package Lambda Functions
        shell: bash
        run: |
          set -euo pipefail

          bash scripts/package_lambdas.sh

      # =====================================================
      # 7. UPLOAD LAMBDA PACKAGES TO S3
      # =====================================================

      - name: Upload Lambda Packages to S3
        shell: bash
        run: |
          set -euo pipefail

          for zip_file in build/*.zip; do

            if [[ ! -f "$zip_file" ]]; then
              echo "::error::No Lambda ZIP packages found"
              exit 1
            fi

            lambda_name=$(basename "$zip_file" .zip)

            aws s3 cp \
              "$zip_file" \
              "s3://${ARTIFACT_BUCKET}/lambda/${lambda_name}/${GITHUB_SHA}.zip" \
              --region "$AWS_REGION"

          done

          echo "Lambda packages uploaded successfully"

      # =====================================================
      # 8. VALIDATE APPLICATION TEMPLATE
      # =====================================================

      - name: Validate Application Template
        shell: bash
        run: |
          set -euo pipefail

          aws cloudformation validate-template \
            --template-body file://Cloudformation/Application_Stack.yaml \
            --region "$AWS_REGION"

      # =====================================================
      # 9. DEPLOY APPLICATION STACK
      # =====================================================

      - name: Deploy Application Stack
        shell: bash
        run: |
          set -euo pipefail

          aws cloudformation deploy \
            --template-file Cloudformation/Application_Stack.yaml \
            --stack-name "$STACK_NAME" \
            --parameter-overrides \
              Environment="$DEPLOY_ENV" \
              ArtifactBucketName="$ARTIFACT_BUCKET" \
              CodeVersion="$GITHUB_SHA" \
            --role-arn "$CFN_EXECUTION_ROLE_ARN" \
            --region "$AWS_REGION" \
            --no-fail-on-empty-changeset

      # =====================================================
      # 10. DISPLAY APPLICATION STACK OUTPUTS
      # =====================================================

      - name: Display Application Stack Outputs
        shell: bash
        run: |
          set -euo pipefail

          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs" \
            --region "$AWS_REGION"

      # =====================================================
      # 11. AUTOMATIC DATABASE INITIALIZATION
      # =====================================================

      - name: Initialize RDS Database
        shell: bash
        run: |
          set -euo pipefail

          FUNCTION_NAME="${PROJECT}-${DEPLOY_ENV}-db-init"

          echo "Checking database initialization status..."

          aws lambda wait function-active-v2 \
            --function-name "$FUNCTION_NAME" \
            --region "$AWS_REGION"

          echo "Invoking database initialization Lambda..."

          aws lambda invoke \
            --function-name "$FUNCTION_NAME" \
            --payload '{}' \
            --cli-binary-format raw-in-base64-out \
            --region "$AWS_REGION" \
            response.json > invoke-metadata.json

          echo "Lambda response:"
          cat response.json

          # Check Lambda execution errors
          if jq -e '.FunctionError != null' invoke-metadata.json > /dev/null; then
            echo "::error::Lambda execution failed"
            exit 1
          fi

          # Check application response
          STATUS_CODE=$(jq -r '.statusCode // empty' response.json)

          if [[ "$STATUS_CODE" != "200" ]]; then
            echo "::error::Database initialization failed"
            exit 1
          fi

          echo "Database initialization completed successfully"