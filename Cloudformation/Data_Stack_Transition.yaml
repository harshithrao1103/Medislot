AWSTemplateFormatVersion: '2010-09-09'

Description: >
  MediSlot Milestone 2 Data Infrastructure -
  RDS MySQL, DynamoDB, S3 and SSM Parameters.

# ============================================================
# TEMPLATE INPUTS - ENVIRONMENT, DATABASE SIZE AND APPLICATION SETTINGS
# These values are supplied when the Data Stack is deployed.
# ============================================================

Parameters:

  Environment:
    Type: String
    AllowedValues:
      - dev
      - staging
      - prod

  DBInstanceClass:
    Type: String
    Description: RDS instance class

  DBAllocatedStorage:
    Type: Number
    MinValue: 20

  DBBackupRetentionDays:
    Type: Number
    MinValue: 0
    MaxValue: 35

  JWTAccessTokenMinutes:
    Type: Number
    MinValue: 1

  RefreshTokenDays:
    Type: Number
    MinValue: 1

  BcryptWorkFactor:
    Type: Number
    MinValue: 12

  WaitlistHoldMinutes:
    Type: Number
    MinValue: 1


# ============================================================
# DEPLOYMENT CONDITIONS - ENABLE PRODUCTION-ONLY SETTINGS
# IsProduction is true only when Environment is set to prod.
# ============================================================

Conditions:

  IsProduction: !Equals
    - !Ref Environment
    - prod


# ============================================================
# AWS RESOURCES - DATABASES, STORAGE BUCKETS AND CONFIGURATION
# ============================================================

Resources:

  # ==========================================================
  # 1. RDS MYSQL - PRIVATE DATABASE NETWORK AND MYSQL INSTANCE
  # ==========================================================

  # Groups the two private subnets where RDS is allowed to place the database.
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup

    Properties:

      DBSubnetGroupDescription: !Sub
        'MediSlot ${Environment} private database subnets'

      SubnetIds:

        - Fn::ImportValue:
            !Sub 'medislot-${Environment}-PrivateSubnetAId'

        - Fn::ImportValue:
            !Sub 'medislot-${Environment}-PrivateSubnetBId'

      Tags:
        - Key: Project
          Value: MediSlot

        - Key: Environment
          Value: !Ref Environment


  # Creates the MediSlot MySQL database, manages its master password in Secrets Manager,
  # enables encryption/backups and applies production-only Multi-AZ and deletion protection.
  MySQLDatabase:
    Type: AWS::RDS::DBInstance
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_118
            comment: RDS enhanced monitoring requires an additional IAM role and operational approval; deferred for dev environment.
          - id: CKV_AWS_157
            comment: Dev database is intentionally single-AZ for cost; enable Multi-AZ in production.
          - id: CKV_AWS_161
            comment: Application uses Secrets Manager credentials; IAM database authentication is not part of this milestone.

    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot

    Properties:

      DBInstanceIdentifier: !Sub
        'medislot-${Environment}-mysql'

      Engine: mysql

      DBInstanceClass: !Ref DBInstanceClass

      AllocatedStorage: !Ref DBAllocatedStorage

      StorageType: gp3
      #General Purpose SSD storage

      StorageEncrypted: true
      KmsKeyId: !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/c73acad8-2834-4e89-96fe-e49523415470"

      DBName: MediSlotDB

      MasterUsername: medislotadmin

      ManageMasterUserPassword: true

      DBSubnetGroupName: !Ref DatabaseSubnetGroup

      VPCSecurityGroups:

        - Fn::ImportValue:
            !Sub 'medislot-${Environment}-RDSSecurityGroupId'

      PubliclyAccessible: false

      MultiAZ: !If
        - IsProduction
        - true
        - false

      BackupRetentionPeriod: !Ref DBBackupRetentionDays

      DeletionProtection: !If
        - IsProduction
        - true
        - false

      AutoMinorVersionUpgrade: true

      CopyTagsToSnapshot: true

      Tags:
        - Key: Project
          Value: MediSlot

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # 2. DYNAMODB - SLOT INVENTORY: STORE DOCTOR APPOINTMENT SLOTS
  # ==========================================================

  SlotInventoryTable:
    Type: AWS::DynamoDB::Table
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_119
            comment: Project encryption policy uses AWS-managed encryption rather than customer-managed KMS keys; encryption at rest remains enabled.

    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

    Properties:

      TableName: !Sub 'medislot-${Environment}-slots'

      BillingMode: PAY_PER_REQUEST

      SSESpecification:
        SSEEnabled: true

      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

      AttributeDefinitions:
        - AttributeName: doctorId
          AttributeType: S
        - AttributeName: slotKey
          AttributeType: S

      # Query slots directly by doctor and chronological slot key.
      # slotKey = startTimeUTC + '#' + slotId.
      KeySchema:
        - AttributeName: doctorId
          KeyType: HASH
        - AttributeName: slotKey
          KeyType: RANGE


  # ==========================================================
  # 3. DYNAMODB - IDEMPOTENCY: PREVENT DUPLICATE REQUEST PROCESSING
  # ==========================================================

  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_119
            comment: Project encryption policy uses AWS-managed encryption rather than customer-managed KMS keys; encryption at rest remains enabled.

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:

      TableName: !Sub 'medislot-${Environment}-idempotency'

      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      BillingMode: PAY_PER_REQUEST

      SSESpecification:
        SSEEnabled: true

      AttributeDefinitions:
        - AttributeName: idempotencyKey
          AttributeType: S

      KeySchema:
        - AttributeName: idempotencyKey
          KeyType: HASH

      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true


  # ==========================================================
  # 4. DYNAMODB - REFRESH TOKENS: STORE REFRESH-TOKEN RECORDS BY TOKEN HASH
  # ==========================================================

  RefreshTokensTable:
    Type: AWS::DynamoDB::Table
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_119
            comment: Project encryption policy uses AWS-managed encryption rather than customer-managed KMS keys; encryption at rest remains enabled.

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:

      TableName: !Sub 'medislot-${Environment}-refresh-tokens'

      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      BillingMode: PAY_PER_REQUEST

      SSESpecification:
        SSEEnabled: true

      AttributeDefinitions:
        - AttributeName: tokenHash
          AttributeType: S

      KeySchema:
        - AttributeName: tokenHash
          KeyType: HASH

      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true


  # ==========================================================
  # 5. DYNAMODB - REVOKED JWT TOKENS: TRACK INVALIDATED JWT TOKENS
  # ==========================================================

  RevokedTokensTable:
    Type: AWS::DynamoDB::Table
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_119
            comment: Project encryption policy uses AWS-managed encryption rather than customer-managed KMS keys; encryption at rest remains enabled.

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:

      TableName: !Sub 'medislot-${Environment}-revoked-jwts'

      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      BillingMode: PAY_PER_REQUEST

      SSESpecification:
        SSEEnabled: true

      AttributeDefinitions:
        - AttributeName: jti
          AttributeType: S

      KeySchema:
        - AttributeName: jti
          KeyType: HASH

      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true


  # ==========================================================
  # 6. DYNAMODB - WAITLIST: STORE PATIENTS WAITING FOR AVAILABLE SLOTS
  # ==========================================================

  WaitlistTable:
    Type: AWS::DynamoDB::Table
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_119
            comment: Project encryption policy uses AWS-managed encryption rather than customer-managed KMS keys; encryption at rest remains enabled.

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:

      TableName: !Sub 'medislot-${Environment}-waitlist'

      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      BillingMode: PAY_PER_REQUEST

      SSESpecification:
        SSEEnabled: true

      AttributeDefinitions:

        - AttributeName: slotId
          AttributeType: S

        - AttributeName: entryId
          AttributeType: S

      KeySchema:

        - AttributeName: slotId
          KeyType: HASH

        - AttributeName: entryId
          KeyType: RANGE

      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true


  # ==========================================================
  # 7. DYNAMODB - NOTIFICATION DISPATCH: TRACK NOTIFICATION WORK ITEMS
  # ==========================================================

  NotificationDispatchTable:
    Type: AWS::DynamoDB::Table
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_119
            comment: Project encryption policy uses AWS-managed encryption rather than customer-managed KMS keys; encryption at rest remains enabled.

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:

      TableName: !Sub
        'medislot-${Environment}-notification-dispatch'

      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      BillingMode: PAY_PER_REQUEST

      SSESpecification:
        SSEEnabled: true

      AttributeDefinitions:
        - AttributeName: dispatchId
          AttributeType: S

      KeySchema:
        - AttributeName: dispatchId
          KeyType: HASH


  # ==========================================================
  # 8. S3 - PROFILE PHOTOS AND ACCESS-LOG STORAGE
  # ==========================================================

  # Destination bucket for S3 server access logs; it does not store profile images.
  ServerAccessLogsBucket:
    Type: AWS::S3::Bucket
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: Destination for S3 server access logs; logging this bucket to itself would create a recursive logging configuration.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'medislot-${Environment}-server-access-logs-v2-${AWS::AccountId}-${AWS::Region}'
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAccessLogs
            Status: Enabled
            ExpirationInDays: 90
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # Allows S3 logging delivery from the configured source buckets and denies HTTP access.
  ServerAccessLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ServerAccessLogsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowS3ServerAccessLogDelivery
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${ServerAccessLogsBucket.Arn}/*'
            Condition:
              ArnLike:
                aws:SourceArn:
                  - !GetAtt ProfilePhotosBucket.Arn
                  - !GetAtt SAMArtifactsBucket.Arn
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt ServerAccessLogsBucket.Arn
              - !Sub '${ServerAccessLogsBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # Stores patient and doctor profile images; sends its S3 access logs to the logs bucket.
  ProfilePhotosBucket:
    Type: AWS::S3::Bucket

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [POST]
            AllowedOrigins: ['*']
            AllowedHeaders: ['*']
            MaxAge: 300
      LoggingConfiguration:
        DestinationBucketName: !Ref ServerAccessLogsBucket
        LogFilePrefix: profile-photos/

      BucketName: !Sub
        'medislot-${Environment}-profile-photos-${AWS::AccountId}-${AWS::Region}'

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      VersioningConfiguration:
        Status: Enabled

      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

      Tags:
        - Key: Project
          Value: MediSlot

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # 9. S3 - PROFILE PHOTOS BUCKET POLICY: ENFORCE HTTPS ACCESS
  # ==========================================================

  # Enforces HTTPS-only access to the profile-photo bucket and its objects.
  ProfilePhotosBucketPolicy:
    Type: AWS::S3::BucketPolicy

    Properties:

      Bucket: !Ref ProfilePhotosBucket

      PolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Sid: DenyInsecureTransport

            Effect: Deny

            Principal: '*'

            Action: 's3:*'

            Resource:

              - !GetAtt ProfilePhotosBucket.Arn

              - !Sub '${ProfilePhotosBucket.Arn}/*'

            Condition:
              Bool:
                'aws:SecureTransport': 'false'


  # ==========================================================
  # 10. S3 - SAM ARTIFACTS BUCKET: STORE DEPLOYMENT PACKAGES
  # ==========================================================

  # Stores packaged application artifacts used by AWS SAM deployments.
  SAMArtifactsBucket:
    Type: AWS::S3::Bucket

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      LoggingConfiguration:
        DestinationBucketName: !Ref ServerAccessLogsBucket
        LogFilePrefix: sam-artifacts/

      BucketName: !Sub
        'medislot-${Environment}-sam-artifacts-${AWS::AccountId}-${AWS::Region}'

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      VersioningConfiguration:
        Status: Enabled

      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

      Tags:
        - Key: Project
          Value: MediSlot

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # 11. S3 - SAM ARTIFACTS BUCKET POLICY: ENFORCE HTTPS ACCESS
  # ==========================================================

  # Enforces HTTPS-only access to the SAM artifacts bucket and its objects.
  SAMArtifactsBucketPolicy:
    Type: AWS::S3::BucketPolicy

    Properties:

      Bucket: !Ref SAMArtifactsBucket

      PolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Sid: DenyInsecureTransport

            Effect: Deny

            Principal: '*'

            Action: 's3:*'

            Resource:

              - !GetAtt SAMArtifactsBucket.Arn

              - !Sub '${SAMArtifactsBucket.Arn}/*'

            Condition:
              Bool:
                'aws:SecureTransport': 'false'


  # ==========================================================
  # 12. SSM PARAMETER STORE - CONFIGURE JWT ACCESS-TOKEN LIFETIME
  # ==========================================================

  AccessTokenMinutesParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name: !Sub
        '/medislot/${Environment}/auth/access-token-minutes'

      Type: String

      Value: !Sub '${JWTAccessTokenMinutes}'


  # ==========================================================
  # 13. SSM PARAMETER STORE - CONFIGURE REFRESH-TOKEN LIFETIME
  # ==========================================================

  RefreshTokenDaysParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name: !Sub
        '/medislot/${Environment}/auth/refresh-token-days'

      Type: String

      Value: !Sub '${RefreshTokenDays}'


  # ==========================================================
  # 14. SSM PARAMETER STORE - CONFIGURE PASSWORD-HASHING COST
  # ==========================================================

  BcryptWorkFactorParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name: !Sub
        '/medislot/${Environment}/auth/bcrypt-work-factor'

      Type: String

      Value: !Sub '${BcryptWorkFactor}'


  # ==========================================================
  # 15. SSM PARAMETER STORE - CONFIGURE WAITLIST HOLD DURATION
  # ==========================================================

  WaitlistHoldMinutesParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name: !Sub
        '/medislot/${Environment}/waitlist/hold-minutes'

      Type: String

      Value: !Sub '${WaitlistHoldMinutes}'

  # Stores the minimum password length consumed by the application.
  PasswordMinLengthParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /medislot/${Environment}/auth/password-min-length
      Type: String
      Value: '10'


# ============================================================
# STACK OUTPUTS - EXPORT RESOURCE DETAILS FOR OTHER CLOUDFORMATION STACKS
# ============================================================

Outputs:

  DatabaseEndpoint:
    Description: RDS MySQL endpoint
    Value: !GetAtt MySQLDatabase.Endpoint.Address

    Export:
      Name: !Sub 'medislot-${Environment}-DBEndpoint'


  DatabasePort:
    Description: RDS MySQL port
    Value: !GetAtt MySQLDatabase.Endpoint.Port

    Export:
      Name: !Sub 'medislot-${Environment}-DBPort'


  DatabaseName:
    Description: MySQL database name
    Value: MediSlotDB

    Export:
      Name: !Sub 'medislot-${Environment}-DBName'


  DatabaseMasterSecretArn:
    Description: RDS managed master credentials secret ARN
    Value: !GetAtt MySQLDatabase.MasterUserSecret.SecretArn

    Export:
      Name: !Sub 'medislot-${Environment}-DBMasterSecretArn'


  ProfilePhotosBucketName:
    Description: S3 bucket for patient and doctor profile photos
    Value: !Ref ProfilePhotosBucket

    Export:
      Name: !Sub 'medislot-${Environment}-ProfilePhotosBucketName'


  SAMArtifactsBucketName:
    Description: S3 bucket for SAM deployment artifacts
    Value: !Ref SAMArtifactsBucket

    Export:
      Name: !Sub 'medislot-${Environment}-SAMArtifactsBucketName'


  SlotInventoryTableName:
    Description: DynamoDB slot inventory table using doctorId/slotKey primary key
    Value: !Ref SlotInventoryTable
    Export:
      Name: !Sub 'medislot-${Environment}-SlotInventoryTableName'

  # Temporary compatibility export. Keep this during the transition because
  # the currently deployed Application Stack still imports this export.
  # Remove it by deploying the final Data_Stack.yaml after Application_Stack.yaml.
  SlotInventoryTableV2Name:
    Description: Temporary compatibility alias for the single Slots table
    Value: !Ref SlotInventoryTable
    Export:
      Name: !Sub 'medislot-${Environment}-SlotInventoryTableV2Name'


  RefreshTokensTableName:
    Description: DynamoDB refresh tokens table
    Value: !Ref RefreshTokensTable

    Export:
      Name: !Sub 'medislot-${Environment}-RefreshTokensTableName'