AWSTemplateFormatVersion: '2010-09-09'
Description: MediSlot Application Infrastructure

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - staging
      - prod

  ArtifactBucketName:
    Type: String
    Description: Existing S3 artifacts bucket name

  DoctorDashboardAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

  CodeVersion:
    Type: String
    Description: Git commit SHA for Lambda packages

  ApiDeploymentVersion:
    Type: String
    Default: initial
    Description: Change this value to publish a fresh API Gateway deployment snapshot

Resources:

  # =====================================================
  # 1. DATABASE INITIALIZATION LAMBDA
  # =====================================================

  # --- DBInitLambda: Initializes the application database schema and seed/setup data ---
  DBInitLambda:
    Type: AWS::Lambda::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_115
            comment: Development environment uses shared Lambda concurrency because account quota cannot support per-function reservations.
          - id: CKV_AWS_173
            comment: Lambda environment values are encrypted at rest with the AWS-managed Lambda key; customer-managed key is outside project key policy.
          - id: CKV_AWS_116
            comment: This Lambda is invoked synchronously; Lambda async DLQ does not apply to synchronous API Gateway invocations.
    Properties:
      FunctionName: !Sub medislot-${Environment}-db-init
      Runtime: python3.12
      Handler: db_init_lambda.lambda_handler
      Role:
        Fn::ImportValue: !Sub medislot-${Environment}-DBInitLambdaExecutionRoleArn
      Code:
        S3Bucket: !Ref ArtifactBucketName
        S3Key: !Sub lambda/db_init/${CodeVersion}.zip
      Timeout: 60
      MemorySize: 256
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: !Sub medislot-${Environment}-LambdaSecurityGroupId
        SubnetIds:
          - Fn::ImportValue: !Sub medislot-${Environment}-PrivateSubnetAId
          - Fn::ImportValue: !Sub medislot-${Environment}-PrivateSubnetBId
      Environment:
        Variables:
          DB_HOST:
            Fn::ImportValue: !Sub medislot-${Environment}-DBEndpoint
          DB_PORT:
            Fn::ImportValue: !Sub medislot-${Environment}-DBPort
          DB_NAME:
            Fn::ImportValue: !Sub medislot-${Environment}-DBName
          DB_SECRET_ARN:
            Fn::ImportValue: !Sub medislot-${Environment}-DBMasterSecretArn
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # =====================================================
  # 2. AUTHENTICATION LAMBDAS AND LOG GROUPS
  # =====================================================

  # --- DoctorRegisterLogGroup: Stores logs produced by the doctor registration Lambda ---
  DoctorRegisterLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: CloudWatch Logs provides encryption at rest by default; project policy does not provision customer-managed KMS keys.
    Properties:
      LogGroupName: !Sub /aws/lambda/medislot-${Environment}-doctor-register
      RetentionInDays: 14

  # --- DoctorRegisterLambda: Handles doctor account registration ---
  DoctorRegisterLambda:
    Type: AWS::Lambda::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_115
            comment: Development environment uses shared Lambda concurrency because account quota cannot support per-function reservations.
          - id: CKV_AWS_173
            comment: Lambda environment values are encrypted at rest with the AWS-managed Lambda key; customer-managed key is outside project key policy.
          - id: CKV_AWS_116
            comment: This Lambda is invoked synchronously; Lambda async DLQ does not apply to synchronous API Gateway invocations.
    Properties:
      FunctionName: !Sub medislot-${Environment}-doctor-register
      Runtime: python3.12
      Handler: doctor_register_lambda.lambda_handler
      Role:
        Fn::ImportValue: !Sub medislot-${Environment}-DoctorRegisterLambdaExecutionRoleArn
      Code:
        S3Bucket: !Ref ArtifactBucketName
        S3Key: !Sub lambda/doctor_register/${CodeVersion}.zip
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          AUTH_SSM_PREFIX: !Sub /medislot/${Environment}/auth
          ENVIRONMENT: !Ref Environment
          REFRESH_TABLE: !Sub medislot-${Environment}-refresh-tokens
          REVOKED_TABLE: !Sub medislot-${Environment}-revoked-jwts
          DB_HOST:
            Fn::ImportValue: !Sub medislot-${Environment}-DBEndpoint
          DB_PORT:
            Fn::ImportValue: !Sub medislot-${Environment}-DBPort
          DB_NAME:
            Fn::ImportValue: !Sub medislot-${Environment}-DBName
          DB_SECRET_ARN:
            Fn::ImportValue: !Sub medislot-${Environment}-DBMasterSecretArn
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: !Sub medislot-${Environment}-LambdaSecurityGroupId
        SubnetIds:
          - Fn::ImportValue: !Sub medislot-${Environment}-PrivateSubnetAId
          - Fn::ImportValue: !Sub medislot-${Environment}-PrivateSubnetBId
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # --- PatientRegisterLogGroup: Stores logs produced by the patient registration Lambda ---
  PatientRegisterLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: CloudWatch Logs provides encryption at rest by default; project policy does not provision customer-managed KMS keys.
    Properties:
      LogGroupName: !Sub /aws/lambda/medislot-${Environment}-patient-register
      RetentionInDays: 14

  # --- PatientRegisterLambda: Handles patient account registration ---
  PatientRegisterLambda:
    Type: AWS::Lambda::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_115
            comment: Development environment uses shared Lambda concurrency because account quota cannot support per-function reservations.
          - id: CKV_AWS_173
            comment: Lambda environment values are encrypted at rest with the AWS-managed Lambda key; customer-managed key is outside project key policy.
          - id: CKV_AWS_116
            comment: This Lambda is invoked synchronously; Lambda async DLQ does not apply to synchronous API Gateway invocations.
    Properties:
      FunctionName: !Sub medislot-${Environment}-patient-register
      Runtime: python3.12
      Handler: patient_register_lambda.lambda_handler
      Role:
        Fn::ImportValue: !Sub medislot-${Environment}-PatientRegisterLambdaExecutionRoleArn
      Code:
        S3Bucket: !Ref ArtifactBucketName
        S3Key: !Sub lambda/patient_register/${CodeVersion}.zip
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          AUTH_SSM_PREFIX: !Sub /medislot/${Environment}/auth
          ENVIRONMENT: !Ref Environment
          REFRESH_TABLE: !Sub medislot-${Environment}-refresh-tokens
          REVOKED_TABLE: !Sub medislot-${Environment}-revoked-jwts
          DB_HOST:
            Fn::ImportValue: !Sub medislot-${Environment}-DBEndpoint
          DB_PORT:
            Fn::ImportValue: !Sub medislot-${Environment}-DBPort
          DB_NAME:
            Fn::ImportValue: !Sub medislot-${Environment}-DBName
          DB_SECRET_ARN:
            Fn::ImportValue: !Sub medislot-${Environment}-DBMasterSecretArn
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: !Sub medislot-${Environment}-LambdaSecurityGroupId
        SubnetIds:
          - Fn::ImportValue: !Sub medislot-${Environment}-PrivateSubnetAId
          - Fn::ImportValue: !Sub medislot-${Environment}-PrivateSubnetBId
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # --- LoginLogGroup: Stores logs produced by the login Lambda ---
  LoginLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: CloudWatch Logs provides encryption at rest by default; project policy does not provision customer-managed KMS keys.
    Properties:
      LogGroupName: !Sub /aws/lambda/medislot-${Environment}-login
      RetentionInDays: 14

  # --- LoginLambda: Authenticates doctor and patient login requests ---
  LoginLambda:
    Type: AWS::Lambda::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_115
            comment: Development environment uses shared Lambda concurrency because account quota cannot support per-function reservations.
          - id: CKV_AWS_173
            comment: Lambda environment values are encrypted at rest with the AWS-managed Lambda key; customer-managed key is outside project key policy.
          - id: CKV_AWS_116
            comment: This Lambda is invoked synchronously; Lambda async DLQ does not apply to synchronous API Gateway invocations.
    Properties:
      FunctionName: !Sub medislot-${Environment}-login
      Runtime: python3.12
      Handler: login_lambda.lambda_handler
      Role:
        Fn::ImportValue: !Sub medislot-${Environment}-LoginLambdaExecutionRoleArn
      Code:
        S3Bucket: !Ref ArtifactBucketName
        S3Key: !Sub lambda/login/${CodeVersion}.zip
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          AUTH_SSM_PREFIX: !Sub /medislot/${Environment}/auth
          REFRESH_TABLE: !Sub medislot-${Environment}-refresh-tokens
          REVOKED_TABLE: !Sub medislot-${Environment}-revoked-jwts
          DB_HOST:
            Fn::ImportValue: !Sub medislot-${Environment}-DBEndpoint
          DB_PORT:
            Fn::ImportValue: !Sub medislot-${Environment}-DBPort
          DB_NAME:
            Fn::ImportValue: !Sub medislot-${Environment}-DBName
          DB_SECRET_ARN:
            Fn::ImportValue: !Sub medislot-${Environment}-DBMasterSecretArn
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: !Sub medislot-${Environment}-LambdaSecurityGroupId
        SubnetIds:
          - Fn::ImportValue: !Sub medislot-${Environment}-PrivateSubnetAId
          - Fn::ImportValue: !Sub medislot-${Environment}-PrivateSubnetBId
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # --- TokenLogGroup: Stores logs produced by the token management Lambda ---
  TokenLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: CloudWatch Logs provides encryption at rest by default; project policy does not provision customer-managed KMS keys.
    Properties:
      LogGroupName: !Sub /aws/lambda/medislot-${Environment}-token
      RetentionInDays: 14

  # --- TokenLambda: Handles token refresh and logout-related token operations ---
  TokenLambda:
    Type: AWS::Lambda::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_115
            comment: Development environment uses shared Lambda concurrency because account quota cannot support per-function reservations.
          - id: CKV_AWS_173
            comment: Lambda environment values are encrypted at rest with the AWS-managed Lambda key; customer-managed key is outside project key policy.
          - id: CKV_AWS_116
            comment: This Lambda is invoked synchronously; Lambda async DLQ does not apply to synchronous API Gateway invocations.
          - id: CKV_AWS_117
            comment: Function does not require RDS network access; keeping it outside the VPC preserves access to regional AWS APIs without extra endpoints.
    Properties:
      FunctionName: !Sub medislot-${Environment}-token
      Runtime: python3.12
      Handler: token_lambda.lambda_handler
      Role:
        Fn::ImportValue: !Sub medislot-${Environment}-TokenLambdaExecutionRoleArn
      Code:
        S3Bucket: !Ref ArtifactBucketName
        S3Key: !Sub lambda/token/${CodeVersion}.zip
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          AUTH_SSM_PREFIX: !Sub /medislot/${Environment}/auth
          REFRESH_TABLE: !Sub medislot-${Environment}-refresh-tokens
          REVOKED_TABLE: !Sub medislot-${Environment}-revoked-jwts
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # --- AuthorizerLogGroup: Stores logs produced by the JWT authorizer Lambda ---
  AuthorizerLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: CloudWatch Logs provides encryption at rest by default; project policy does not provision customer-managed KMS keys.
    Properties:
      LogGroupName: !Sub /aws/lambda/medislot-${Environment}-authorizer
      RetentionInDays: 14

  # --- AuthorizerLambda: Validates JWT tokens for protected API Gateway routes ---
  AuthorizerLambda:
    Type: AWS::Lambda::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_115
            comment: Development environment uses shared Lambda concurrency because account quota cannot support per-function reservations.
          - id: CKV_AWS_173
            comment: Lambda environment values are encrypted at rest with the AWS-managed Lambda key; customer-managed key is outside project key policy.
          - id: CKV_AWS_116
            comment: This Lambda is invoked synchronously; Lambda async DLQ does not apply to synchronous API Gateway invocations.
          - id: CKV_AWS_117
            comment: Function does not require RDS network access; keeping it outside the VPC preserves access to regional AWS APIs without extra endpoints.
    Properties:
      FunctionName: !Sub medislot-${Environment}-authorizer
      Runtime: python3.12
      Handler: authorizer_lambda.lambda_handler
      Role:
        Fn::ImportValue: !Sub medislot-${Environment}-AuthorizerLambdaExecutionRoleArn
      Code:
        S3Bucket: !Ref ArtifactBucketName
        S3Key: !Sub lambda/authorizer/${CodeVersion}.zip
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          AUTH_SSM_PREFIX: !Sub /medislot/${Environment}/auth
          REFRESH_TABLE: !Sub medislot-${Environment}-refresh-tokens
          REVOKED_TABLE: !Sub medislot-${Environment}-revoked-jwts
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # --- AuthTestLogGroup: Stores logs produced by the authentication test Lambda ---
  AuthTestLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: CloudWatch Logs provides encryption at rest by default; project policy does not provision customer-managed KMS keys.
    Properties:
      LogGroupName: !Sub /aws/lambda/medislot-${Environment}-auth-test
      RetentionInDays: 14

  # --- AuthTestLambda: Handles the protected doctor authentication-check endpoint ---
  AuthTestLambda:
    Type: AWS::Lambda::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_115
            comment: Development environment uses shared Lambda concurrency because account quota cannot support per-function reservations.
          - id: CKV_AWS_173
            comment: Lambda environment values are encrypted at rest with the AWS-managed Lambda key; customer-managed key is outside project key policy.
          - id: CKV_AWS_116
            comment: This Lambda is invoked synchronously; Lambda async DLQ does not apply to synchronous API Gateway invocations.
          - id: CKV_AWS_117
            comment: Function does not require RDS network access; keeping it outside the VPC preserves access to regional AWS APIs without extra endpoints.
    Properties:
      FunctionName: !Sub medislot-${Environment}-auth-test
      Runtime: python3.12
      Handler: auth_test_lambda.lambda_handler
      Role:
        Fn::ImportValue: !Sub medislot-${Environment}-AuthTestLambdaExecutionRoleArn
      Code:
        S3Bucket: !Ref ArtifactBucketName
        S3Key: !Sub lambda/auth_test/${CodeVersion}.zip
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          AUTH_SSM_PREFIX: !Sub /medislot/${Environment}/auth
          REFRESH_TABLE: !Sub medislot-${Environment}-refresh-tokens
          REVOKED_TABLE: !Sub medislot-${Environment}-revoked-jwts
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # =====================================================
  # 3. API GATEWAY
  # =====================================================

  # NEW: Configure API Gateway to use the CloudWatch
  # IAM role created by the Security/IAM Stack.

  # --- ApiGatewayAccount: Configures API Gateway's account-level CloudWatch logging role ---
  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn:
        Fn::ImportValue: !Sub medislot-${Environment}-ApiGatewayCloudWatchRoleArn

  # --- AuthRestApi: Creates the regional MediSlot REST API ---
  AuthRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub medislot-${Environment}-auth-api
      EndpointConfiguration:
        Types: [REGIONAL]

  # --- SpecializationsResource: Defines the /specializations API path ---
  SpecializationsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthRestApi
      ParentId: !GetAtt AuthRestApi.RootResourceId
      PathPart: specializations

  # --- SpecializationsGet: Public GET endpoint for listing doctor specializations ---
  SpecializationsGet:
    Type: AWS::ApiGateway::Method
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_59
            comment: "Public read-only specialization list required during doctor registration before login."
    Properties:
      RestApiId: !Ref AuthRestApi
      ResourceId: !Ref SpecializationsResource  
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DoctorRegisterLambda.Arn}/invocations
  # --- SpecializationsInvokePermission: Allows API Gateway to invoke the doctor registration Lambda for specializations ---
  SpecializationsInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref DoctorRegisterLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${AuthRestApi}/*/GET/specializations

  # --- AuthResource: Defines the /auth API path ---
  AuthResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthRestApi
      ParentId: !GetAtt AuthRestApi.RootResourceId
      PathPart: auth

  # --- DoctorsResource: Defines the /auth/doctors API path ---
  DoctorsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthRestApi
      ParentId: !Ref AuthResource
      PathPart: doctors

  # --- PatientsResource: Defines the /auth/patients API path ---
  PatientsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthRestApi
      ParentId: !Ref AuthResource
      PathPart: patients

  # --- DoctorCheckResource: Defines the /doctor-auth-check API path ---
  DoctorCheckResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthRestApi
      ParentId: !GetAtt AuthRestApi.RootResourceId
      PathPart: doctor-auth-check

  # --- JwtAuthorizer: Configures the custom TOKEN-based JWT authorizer ---
  JwtAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: !Sub medislot-${Environment}-jwt-authorizer
      Type: TOKEN
      RestApiId: !Ref AuthRestApi
      IdentitySource: method.request.header.Authorization
      AuthorizerResultTtlInSeconds: 0
      AuthorizerUri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerLambda.Arn}/invocations

  # --- AuthorizerInvokePermission: Allows API Gateway to invoke the JWT authorizer Lambda ---
  AuthorizerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuthorizerLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${AuthRestApi}/authorizers/${JwtAuthorizer}

  # --- DoctorRegisterResource: Defines the /auth/doctors/register API path ---
  DoctorRegisterResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthRestApi
      ParentId: !Ref DoctorsResource
      PathPart: register

  # --- DoctorLoginResource: Defines the /auth/doctors/login API path ---
  DoctorLoginResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthRestApi
      ParentId: !Ref DoctorsResource
      PathPart: login

  # --- PatientRegisterResource: Defines the /auth/patients/register API path ---
  PatientRegisterResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthRestApi
      ParentId: !Ref PatientsResource
      PathPart: register

  # --- PatientLoginResource: Defines the /auth/patients/login API path ---
  PatientLoginResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthRestApi
      ParentId: !Ref PatientsResource
      PathPart: login

  # --- RefreshResource: Defines the /auth/refresh API path ---
  RefreshResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthRestApi
      ParentId: !Ref AuthResource
      PathPart: refresh

  # --- LogoutResource: Defines the /auth/logout API path ---
  LogoutResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthRestApi
      ParentId: !Ref AuthResource
      PathPart: logout

  # =====================================================
  # 4. API GATEWAY METHODS AND PERMISSIONS
  # =====================================================

  # --- DoctorRegisterMethod: POST endpoint for doctor registration ---
  DoctorRegisterMethod:
    Type: AWS::ApiGateway::Method
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_59
            comment: Public authentication bootstrap endpoint; request validation and application-level protections remain necessary; JWT is not available before login.
    Properties:
      RestApiId: !Ref AuthRestApi
      ResourceId: !Ref DoctorRegisterResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DoctorRegisterLambda.Arn}/invocations

  # --- DoctorRegisterInvokePermission: Allows API Gateway to invoke the doctor registration Lambda ---
  DoctorRegisterInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DoctorRegisterLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${AuthRestApi}/*/POST/*

  # --- PatientRegisterMethod: POST endpoint for patient registration ---
  PatientRegisterMethod:
    Type: AWS::ApiGateway::Method
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_59
            comment: Public authentication bootstrap endpoint; request validation and application-level protections remain necessary; JWT is not available before login.
    Properties:
      RestApiId: !Ref AuthRestApi
      ResourceId: !Ref PatientRegisterResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PatientRegisterLambda.Arn}/invocations

  # --- PatientRegisterInvokePermission: Allows API Gateway to invoke the patient registration Lambda ---
  PatientRegisterInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PatientRegisterLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${AuthRestApi}/*/POST/*

  # --- DoctorLoginMethod: POST endpoint for doctor login ---
  DoctorLoginMethod:
    Type: AWS::ApiGateway::Method
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_59
            comment: Public authentication bootstrap endpoint; request validation and application-level protections remain necessary; JWT is not available before login.
    Properties:
      RestApiId: !Ref AuthRestApi
      ResourceId: !Ref DoctorLoginResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LoginLambda.Arn}/invocations

  # --- DoctorLoginInvokePermission: Allows API Gateway to invoke the login Lambda for doctor login ---
  DoctorLoginInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LoginLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${AuthRestApi}/*/POST/*

  # --- PatientLoginMethod: POST endpoint for patient login ---
  PatientLoginMethod:
    Type: AWS::ApiGateway::Method
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_59
            comment: Public authentication bootstrap endpoint; request validation and application-level protections remain necessary; JWT is not available before login.
    Properties:
      RestApiId: !Ref AuthRestApi
      ResourceId: !Ref PatientLoginResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LoginLambda.Arn}/invocations

  # --- PatientLoginInvokePermission: Allows API Gateway to invoke the login Lambda for patient login ---
  PatientLoginInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LoginLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${AuthRestApi}/*/POST/*

  # --- RefreshMethod: POST endpoint for refreshing authentication tokens ---
  RefreshMethod:
    Type: AWS::ApiGateway::Method
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_59
            comment: Public authentication bootstrap endpoint; request validation and application-level protections remain necessary; JWT is not available before login.
    Properties:
      RestApiId: !Ref AuthRestApi
      ResourceId: !Ref RefreshResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TokenLambda.Arn}/invocations

  # --- RefreshInvokePermission: Allows API Gateway to invoke the token Lambda for token refresh ---
  RefreshInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TokenLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${AuthRestApi}/*/POST/*

  # --- LogoutMethod: Authenticated POST endpoint for logging out ---
  LogoutMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AuthRestApi
      ResourceId: !Ref LogoutResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TokenLambda.Arn}/invocations

  # --- LogoutInvokePermission: Allows API Gateway to invoke the token Lambda for logout ---
  LogoutInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TokenLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${AuthRestApi}/*/POST/*

  # --- DoctorCheckMethod: Authenticated GET endpoint for checking doctor authentication ---
  DoctorCheckMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AuthRestApi
      ResourceId: !Ref DoctorCheckResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthTestLambda.Arn}/invocations

  # --- DoctorCheckInvokePermission: Allows API Gateway to invoke the authentication test Lambda ---
  DoctorCheckInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuthTestLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${AuthRestApi}/*/GET/*

  # =====================================================
  # MILESTONE 6: WAITLIST, RESCHEDULE SAGA AND EVENT CONSUMERS
  # =====================================================
  Milestone6LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/medislot-${Environment}-milestone6
      RetentionInDays: 14
      KmsKeyId:
        Fn::ImportValue: !Sub medislot-${Environment}-CloudWatchLogsKmsKeyArn

  Milestone6Lambda:
    Type: AWS::Lambda::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_115
            comment: Development environment uses shared Lambda concurrency because the AWS account concurrency quota cannot support per-function reservations.
          - id: CKV_AWS_116
            comment: SQS and SNS dead-letter queues are excluded by project architecture. API Gateway calls are synchronous, Step Functions tasks define retries and catches, EventBridge and Scheduler use managed retry behavior, and Lambda/Step Functions error metrics have CloudWatch alarms.
    Properties:
      FunctionName: !Sub medislot-${Environment}-milestone6
      Runtime: python3.12
      Handler: milestone6_lambda.lambda_handler
      Role:
        Fn::ImportValue: !Sub medislot-${Environment}-AppointmentApiLambdaRoleArn
      KmsKeyArn:
        Fn::ImportValue: !Sub medislot-${Environment}-CloudWatchLogsKmsKeyArn
      Code:
        S3Bucket: !Ref ArtifactBucketName
        S3Key: !Sub lambda/milestone6/${CodeVersion}.zip
      Timeout: 60
      MemorySize: 512
      TracingConfig: { Mode: Active }
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: !Sub medislot-${Environment}-LambdaSecurityGroupId
        SubnetIds:
          - Fn::ImportValue: !Sub medislot-${Environment}-PrivateSubnetAId
          - Fn::ImportValue: !Sub medislot-${Environment}-PrivateSubnetBId
      Environment:
        Variables:
          WAITLIST_TABLE: !Sub medislot-${Environment}-waitlist-m6
          SLOTS_TABLE: !Sub medislot-${Environment}-slots
          IDEMPOTENCY_TABLE: !Sub medislot-${Environment}-idempotency
          NOTIFICATION_TABLE: !Sub medislot-${Environment}-notification-dispatch
          EVENT_BUS_NAME: !Sub medislot-${Environment}-appointments
          RESCHEDULE_STATE_MACHINE_ARN: !Sub arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:medislot-${Environment}-reschedule
          SSM_PREFIX: !Sub /medislot/${Environment}/milestone6
          ENVIRONMENT: !Ref Environment
          DB_HOST:
            Fn::ImportValue: !Sub medislot-${Environment}-DBEndpoint
          DB_PORT:
            Fn::ImportValue: !Sub medislot-${Environment}-DBPort
          DB_NAME:
            Fn::ImportValue: !Sub medislot-${Environment}-DBName
          DB_SECRET_ARN:
            Fn::ImportValue: !Sub medislot-${Environment}-DBMasterSecretArn
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  RescheduleLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/vendedlogs/states/medislot-${Environment}-reschedule
      RetentionInDays: 30
      KmsKeyId:
        Fn::ImportValue: !Sub medislot-${Environment}-CloudWatchLogsKmsKeyArn

  RescheduleStateMachineRole:
    Type: AWS::IAM::Role
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_111
            comment: X-Ray trace write APIs do not support resource-level authorization; only PutTraceSegments and PutTelemetryRecords are granted.
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: states.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeMilestone6Steps
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [lambda:InvokeFunction]
                Resource: !GetAtt Milestone6Lambda.Arn
              - Effect: Allow
                Action: [xray:PutTraceSegments, xray:PutTelemetryRecords]
                Resource: '*'
              - Effect: Allow
                Action: [logs:CreateLogDelivery, logs:GetLogDelivery, logs:UpdateLogDelivery, logs:DeleteLogDelivery, logs:ListLogDeliveries, logs:PutResourcePolicy, logs:DescribeResourcePolicies, logs:DescribeLogGroups]
                Resource: '*'
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${RescheduleLogGroup}:log-stream:*

  RescheduleStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub medislot-${Environment}-reschedule
      StateMachineType: STANDARD
      RoleArn: !GetAtt RescheduleStateMachineRole.Arn
      TracingConfiguration: { Enabled: true }
      LoggingConfiguration:
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt RescheduleLogGroup.Arn
        IncludeExecutionData: false
        Level: ALL
      DefinitionString: !Sub |
        {
          "Comment": "MediSlot reschedule Saga with compensating seat operations",
          "StartAt": "ClaimTarget",
          "States": {
            "ClaimTarget": {"Type":"Task","Resource":"arn:${AWS::Partition}:states:::lambda:invoke","Parameters":{"FunctionName":"${Milestone6Lambda.Arn}","Payload":{"operation":"claim_target","detail.$":"$"}},"OutputPath":"$.Payload","Next":"ReleaseOriginal","Catch":[{"ErrorEquals":["States.ALL"],"ResultPath":"$.failure","Next":"Compensate"}],"Retry":[{"ErrorEquals":["States.ALL"],"IntervalSeconds":1,"BackoffRate":2,"MaxAttempts":2}]},
            "ReleaseOriginal": {"Type":"Task","Resource":"arn:${AWS::Partition}:states:::lambda:invoke","Parameters":{"FunctionName":"${Milestone6Lambda.Arn}","Payload":{"operation":"release_original","detail.$":"$"}},"OutputPath":"$.Payload","Next":"CommitAppointment","Catch":[{"ErrorEquals":["States.ALL"],"ResultPath":"$.failure","Next":"Compensate"}],"Retry":[{"ErrorEquals":["States.ALL"],"IntervalSeconds":1,"BackoffRate":2,"MaxAttempts":2}]},
            "CommitAppointment": {"Type":"Task","Resource":"arn:${AWS::Partition}:states:::lambda:invoke","Parameters":{"FunctionName":"${Milestone6Lambda.Arn}","Payload":{"operation":"commit_appointment","detail.$":"$"}},"OutputPath":"$.Payload","End":true,"Catch":[{"ErrorEquals":["States.ALL"],"ResultPath":"$.failure","Next":"Compensate"}],"Retry":[{"ErrorEquals":["States.ALL"],"IntervalSeconds":1,"BackoffRate":2,"MaxAttempts":2}]},
            "Compensate": {"Type":"Task","Resource":"arn:${AWS::Partition}:states:::lambda:invoke","Parameters":{"FunctionName":"${Milestone6Lambda.Arn}","Payload":{"operation":"compensate","detail.$":"$"}},"OutputPath":"$.Payload","Next":"Failed","Retry":[{"ErrorEquals":["States.ALL"],"IntervalSeconds":1,"BackoffRate":2,"MaxAttempts":2}]},
            "Failed": {"Type":"Fail","Error":"RescheduleFailed","Cause":"Reschedule failed; compensation was attempted where required"}
          }
        }

  Milestone6WaitlistJoinInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Milestone6Lambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${AuthRestApi}/*/POST/slots/*/waitlist
  Milestone6WaitlistLeaveInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Milestone6Lambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${AuthRestApi}/*/DELETE/slots/*/waitlist
  Milestone6PatientWaitlistsInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Milestone6Lambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${AuthRestApi}/*/GET/patients/me/waitlists
  Milestone6AcceptOfferInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Milestone6Lambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${AuthRestApi}/*/POST/waitlist-offers/*/accept
  Milestone6RescheduleInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Milestone6Lambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${AuthRestApi}/*/PATCH/appointments/*
  Milestone6RescheduleStatusInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Milestone6Lambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${AuthRestApi}/*/GET/reschedule-executions

  WaitlistSlotsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthRestApi
      ParentId: !GetAtt AuthRestApi.RootResourceId
      PathPart: slots
  WaitlistSlotIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthRestApi
      ParentId: !Ref WaitlistSlotsResource
      PathPart: '{slotId}'
  WaitlistSlotCollectionResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthRestApi
      ParentId: !Ref WaitlistSlotIdResource
      PathPart: waitlist
  PatientWaitlistsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthRestApi
      ParentId: !Ref PatientMeResource
      PathPart: waitlists
  WaitlistOffersResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthRestApi
      ParentId: !GetAtt AuthRestApi.RootResourceId
      PathPart: waitlist-offers
  WaitlistOfferIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthRestApi
      ParentId: !Ref WaitlistOffersResource
      PathPart: '{offerId}'
  WaitlistOfferAcceptResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthRestApi
      ParentId: !Ref WaitlistOfferIdResource
      PathPart: accept
  RescheduleExecutionsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthRestApi
      ParentId: !GetAtt AuthRestApi.RootResourceId
      PathPart: reschedule-executions


  AppointmentRescheduleMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AuthRestApi
      ResourceId: !Ref AppointmentIdResource
      HttpMethod: PATCH
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${Milestone6Lambda.Arn}/invocations
  RescheduleExecutionStatusMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AuthRestApi
      ResourceId: !Ref RescheduleExecutionsResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${Milestone6Lambda.Arn}/invocations
  WaitlistJoinMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AuthRestApi
      ResourceId: !Ref WaitlistSlotCollectionResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${Milestone6Lambda.Arn}/invocations
  WaitlistLeaveMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AuthRestApi
      ResourceId: !Ref WaitlistSlotCollectionResource
      HttpMethod: DELETE
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${Milestone6Lambda.Arn}/invocations
  PatientWaitlistsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AuthRestApi
      ResourceId: !Ref PatientWaitlistsResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${Milestone6Lambda.Arn}/invocations
  WaitlistOfferAcceptMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AuthRestApi
      ResourceId: !Ref WaitlistOfferAcceptResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${Milestone6Lambda.Arn}/invocations

  WaitlistSeatFreedRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName: !Sub medislot-${Environment}-appointments
      EventPattern: { source: [medislot.appointments], detail-type: [SlotSeatFreed] }
      Targets:
        - Id: WaitlistPromoter
          Arn: !GetAtt Milestone6Lambda.Arn
          InputTransformer:
            InputPathsMap: { detail: '$.detail', correlation: '$.detail.correlationId' }
            InputTemplate: '{"operation":"SlotSeatFreed","detail":<detail>,"correlationId":<correlation>}'
  Milestone6NotificationRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName: !Sub medislot-${Environment}-appointments
      EventPattern:
        source: [medislot.appointments, medislot.milestone6]
        detail-type: [AppointmentBooked, AppointmentRescheduled, AppointmentCancelled, WaitlistHoldOfferIssued, WaitlistHoldOfferExpired]
      Targets:
        - Id: Milestone6NotificationDispatcher
          Arn: !GetAtt Milestone6Lambda.Arn
          InputTransformer:
            InputPathsMap: { detail: '$.detail', eventType: '$.detail-type', correlation: '$.detail.correlationId', eventId: '$.id' }
            InputTemplate: '{"operation":"notify","detail":<detail>,"detail-type":<eventType>,"eventId":<eventId>,"correlationId":<correlation>}'
  Milestone6NotificationInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Milestone6Lambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt Milestone6NotificationRule.Arn

  ReminderScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: scheduler.amazonaws.com }, Action: sts:AssumeRole }]
      Policies:
        - PolicyName: InvokeReminderDispatcher
          PolicyDocument:
            Version: '2012-10-17'
            Statement: [{ Effect: Allow, Action: [lambda:InvokeFunction], Resource: !GetAtt Milestone6Lambda.Arn }]
  ReminderSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub medislot-${Environment}-appointment-reminders
      FlexibleTimeWindow: { Mode: 'OFF' }
      ScheduleExpression: rate(5 minutes)
      Target:
        Arn: !GetAtt Milestone6Lambda.Arn
        RoleArn: !GetAtt ReminderScheduleRole.Arn
        Input: '{"operation":"reminder_dispatch"}'

  WaitlistSeatFreedInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Milestone6Lambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt WaitlistSeatFreedRule.Arn

  WaitlistExpiryScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: scheduler.amazonaws.com }, Action: sts:AssumeRole }]
      Policies:
        - PolicyName: InvokeWaitlistExpiry
          PolicyDocument:
            Version: '2012-10-17'
            Statement: [{ Effect: Allow, Action: [lambda:InvokeFunction], Resource: !GetAtt Milestone6Lambda.Arn }]
  WaitlistExpirySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub medislot-${Environment}-waitlist-expiry
      FlexibleTimeWindow: { Mode: 'OFF' }
      ScheduleExpression: rate(1 minute)
      Target:
        Arn: !GetAtt Milestone6Lambda.Arn
        RoleArn: !GetAtt WaitlistExpiryScheduleRole.Arn
        Input: '{"operation":"expire_offers"}'

  # =====================================================
  # 5. API DEPLOYMENT AND LOGGING
  # =====================================================


  # Milestone 3 doctor domain; existing auth resources are unchanged.
  # --- DoctorApiLogGroup: Stores logs produced by the doctor API Lambda ---
  DoctorApiLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: Development environment uses CloudWatch default encryption at rest.
    Properties:
      LogGroupName: !Sub /aws/lambda/medislot-${Environment}-doctor-api
      RetentionInDays: 14
  # --- SlotMaterialiserLogGroup: Stores logs produced by the slot materialiser Lambda ---
  SlotMaterialiserLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: Development environment uses CloudWatch default encryption at rest.
    Properties:
      LogGroupName: !Sub /aws/lambda/medislot-${Environment}-slot-materialiser
      RetentionInDays: 14

  # --- DoctorApiLambda: Handles authenticated doctor profile, availability, consultation and schedule APIs ---
  DoctorApiLambda:
    Type: AWS::Lambda::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_115
            comment: Development environment uses shared Lambda concurrency.
          - id: CKV_AWS_173
            comment: Lambda environment variables use AWS-managed encryption at rest.
          - id: CKV_AWS_116
            comment: API Gateway invokes this Lambda synchronously; asynchronous DLQ is not applicable.
    Properties:
      FunctionName: !Sub medislot-${Environment}-doctor-api
      Runtime: python3.12
      Handler: doctor_api_lambda.lambda_handler
      Role:
        Fn::ImportValue: !Sub medislot-${Environment}-DoctorApiLambdaRoleArn
      Code:
        S3Bucket: !Ref ArtifactBucketName
        S3Key: !Sub lambda/doctor_api/${CodeVersion}.zip
      Timeout: 30
      MemorySize: 256
      DeadLetterConfig:
        TargetArn:
          Fn::ImportValue: !Sub medislot-${Environment}-AppointmentApiDeadLetterQueueArn
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: !Sub medislot-${Environment}-LambdaSecurityGroupId
        SubnetIds:
          - Fn::ImportValue: !Sub medislot-${Environment}-PrivateSubnetAId
          - Fn::ImportValue: !Sub medislot-${Environment}-PrivateSubnetBId
      Environment:
        Variables:
          PHOTO_BUCKET:
            Fn::ImportValue: !Sub medislot-${Environment}-ProfilePhotosBucketName
          SLOTS_TABLE: !Sub 'medislot-${Environment}-slots'
          SLOT_MATERIALISER_FUNCTION: !Sub medislot-${Environment}-slot-materialiser
          DB_HOST:
            Fn::ImportValue: !Sub medislot-${Environment}-DBEndpoint
          DB_PORT:
            Fn::ImportValue: !Sub medislot-${Environment}-DBPort
          DB_NAME:
            Fn::ImportValue: !Sub medislot-${Environment}-DBName
          DB_SECRET_ARN:
            Fn::ImportValue: !Sub medislot-${Environment}-DBMasterSecretArn

  # --- SlotMaterialiserLambda: Generates/materialises appointment slot inventory ---
  SlotMaterialiserLambda:
    Type: AWS::Lambda::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_115
            comment: Development environment uses shared Lambda concurrency.
          - id: CKV_AWS_173
            comment: Lambda environment variables use AWS-managed encryption at rest.
          - id: CKV_AWS_116
            comment: Development exception; scheduled invocation failures require separate monitoring and recovery.
    Properties:
      FunctionName: !Sub medislot-${Environment}-slot-materialiser
      Runtime: python3.12
      Handler: slot_materialiser_lambda.lambda_handler
      Role:
        Fn::ImportValue: !Sub medislot-${Environment}-SlotMaterialiserRoleArn
      Code:
        S3Bucket: !Ref ArtifactBucketName
        S3Key: !Sub lambda/slot_materialiser/${CodeVersion}.zip
      Timeout: 300
      MemorySize: 256
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: !Sub medislot-${Environment}-LambdaSecurityGroupId
        SubnetIds:
          - Fn::ImportValue: !Sub medislot-${Environment}-PrivateSubnetAId
          - Fn::ImportValue: !Sub medislot-${Environment}-PrivateSubnetBId
      Environment:
        Variables:
          SLOTS_TABLE: !Sub 'medislot-${Environment}-slots'
          BOOKING_WINDOW_PARAM: !Ref BookingWindowDaysParameter
          DB_HOST:
            Fn::ImportValue: !Sub medislot-${Environment}-DBEndpoint
          DB_PORT:
            Fn::ImportValue: !Sub medislot-${Environment}-DBPort
          DB_NAME:
            Fn::ImportValue: !Sub medislot-${Environment}-DBName
          DB_SECRET_ARN:
            Fn::ImportValue: !Sub medislot-${Environment}-DBMasterSecretArn

  # --- BookingWindowDaysParameter: Stores the rolling appointment booking window in SSM Parameter Store ---
  BookingWindowDaysParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /medislot/${Environment}/slots/booking-window-days
      Type: String
      Value: '30'
      Description: Rolling booking window length in days

  # --- DailySlotMaterialiserSchedule: Runs the slot materialiser daily at the configured time ---
  DailySlotMaterialiserSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub 'medislot-${Environment}-daily-slot-materialiser'
      ScheduleExpression: 'cron(30 0 * * ? *)'
      ScheduleExpressionTimezone: Asia/Kolkata
      FlexibleTimeWindow:
        Mode: 'OFF'
      State: ENABLED
      Target:
        Arn: !GetAtt SlotMaterialiserLambda.Arn
        RoleArn:
          Fn::ImportValue: !Sub medislot-${Environment}-MaterialiserSchedulerRoleArn
        Input: '{}'

  # Poll the transactional outbox; this invokes the same Appointment API Lambda.
  AppointmentOutboxSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub medislot-${Environment}-appointment-outbox-dispatch
      ScheduleExpression: rate(1 minute)
      FlexibleTimeWindow:
        Mode: 'OFF'
      State: ENABLED
      Target:
        Arn: !GetAtt AppointmentApiLambda.Arn
        RoleArn:
          Fn::ImportValue: !Sub medislot-${Environment}-AppointmentOutboxSchedulerRoleArn
        Input: '{"operation":"dispatch_outbox","limit":25}'

  # --- DoctorDomainRoot: Defines the /doctors API path ---
  DoctorDomainRoot:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthRestApi
      ParentId: !GetAtt AuthRestApi.RootResourceId
      PathPart: doctors
  # --- DoctorMe: Defines the /doctors/me API path ---
  DoctorMe:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthRestApi
      ParentId: !Ref DoctorDomainRoot
      PathPart: me
  # --- DoctorPhoto: Defines the /doctors/me/photo API path ---
  DoctorPhoto:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthRestApi
      ParentId: !Ref DoctorMe
      PathPart: photo
  # --- DoctorConsultations: Defines the /doctors/me/consultation-types API path ---
  DoctorConsultations:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthRestApi
      ParentId: !Ref DoctorMe
      PathPart: consultation-types
  # --- DoctorConsultationId: Defines the consultation-type item path /{id} ---
  DoctorConsultationId:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthRestApi
      ParentId: !Ref DoctorConsultations
      PathPart: '{id}'
  # --- DoctorAvailability: Defines the /doctors/me/availability API path ---
  DoctorAvailability:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthRestApi
      ParentId: !Ref DoctorMe
      PathPart: availability
