  # Milestone 4 patient and public discovery Lambda.
  # --- PatientDomainLogGroup: Stores logs produced by the patient-domain Lambda ---
  PatientDomainLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/medislot-${Environment}-patient-domain
      RetentionInDays: 14
      KmsKeyId:
        Fn::ImportValue: !Sub medislot-${Environment}-CloudWatchLogsKmsKeyArn
  # --- PatientDomainLambda: Handles patient profile and public doctor-discovery APIs ---
  PatientDomainLambda:
    Type: AWS::Lambda::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_115
            comment: Development shared concurrency.
          - id: CKV_AWS_116
            comment: Synchronous API Lambda, no asynchronous DLQ.
          - id: CKV_AWS_173
            comment: AWS-managed environment encryption.
    Properties:
      FunctionName: !Sub medislot-${Environment}-patient-domain
      Runtime: python3.12
      Handler: patient_domain_lambda.lambda_handler
      Role:
        Fn::ImportValue: !Sub medislot-${Environment}-PatientDomainLambdaRoleArn
      Code:
        S3Bucket: !Ref ArtifactBucketName
        S3Key: !Sub lambda/patient_domain/${CodeVersion}.zip
      Timeout: 30
      MemorySize: 256
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: !Sub medislot-${Environment}-LambdaSecurityGroupId
        SubnetIds:
          - Fn::ImportValue: !Sub medislot-${Environment}-PrivateSubnetAId
          - Fn::ImportValue: !Sub medislot-${Environment}-PrivateSubnetBId
      Environment:
        Variables:
          SLOTS_TABLE: !Sub 'medislot-${Environment}-slots'
          DB_HOST:
            Fn::ImportValue: !Sub medislot-${Environment}-DBEndpoint
          DB_PORT:
            Fn::ImportValue: !Sub medislot-${Environment}-DBPort
          DB_NAME:
            Fn::ImportValue: !Sub medislot-${Environment}-DBName
          DB_SECRET_ARN:
            Fn::ImportValue: !Sub medislot-${Environment}-DBMasterSecretArn
          PHOTO_BUCKET:
            Fn::ImportValue: !Sub medislot-${Environment}-ProfilePhotosBucketName
  # --- PatientMeRoot: Defines the /patients API path ---
  PatientMeRoot:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthRestApi
      ParentId: !GetAtt AuthRestApi.RootResourceId
      PathPart: patients
  # --- PatientMeResource: Defines the /patients/me API path ---
  PatientMeResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthRestApi
      ParentId: !Ref PatientMeRoot
      PathPart: me
  # --- PublicDoctorId: Defines the public doctor detail path /doctors/{doctorId} ---
  PublicDoctorId:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthRestApi
      ParentId: !Ref DoctorDomainRoot
      PathPart: '{doctorId}'
  # --- PublicDoctorSlots: Defines the public doctor slot path /doctors/{doctorId}/slots ---
  PublicDoctorSlots:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthRestApi
      ParentId: !Ref PublicDoctorId
      PathPart: slots
  # --- PatientMeRead: Authenticated GET endpoint for the current patient's profile ---
  PatientMeRead:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AuthRestApi
      ResourceId: !Ref PatientMeResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PatientDomainLambda.Arn}/invocations
  # --- PatientMeUpdate: Authenticated PUT endpoint for updating the current patient's profile ---
  PatientMeUpdate:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AuthRestApi
      ResourceId: !Ref PatientMeResource
      HttpMethod: PUT
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PatientDomainLambda.Arn}/invocations
  # --- PatientMeDelete: Authenticated DELETE endpoint for the current patient's account ---
  PatientMeDelete:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AuthRestApi
      ResourceId: !Ref PatientMeResource
      HttpMethod: DELETE
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PatientDomainLambda.Arn}/invocations
  # --- DoctorDiscoveryGet: Public GET endpoint for browsing doctors ---
  DoctorDiscoveryGet:
    Type: AWS::ApiGateway::Method
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_59
            comment: Public read-only doctor discovery and free-seat lookup is required before patient login.
    Properties:
      RestApiId: !Ref AuthRestApi
      ResourceId: !Ref DoctorDomainRoot
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PatientDomainLambda.Arn}/invocations
  # --- PublicDoctorGet: Public GET endpoint for retrieving one doctor's details ---
  PublicDoctorGet:
    Type: AWS::ApiGateway::Method
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_59
            comment: Public read-only doctor discovery and free-seat lookup is required before patient login.
    Properties:
      RestApiId: !Ref AuthRestApi
      ResourceId: !Ref PublicDoctorId
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PatientDomainLambda.Arn}/invocations
  # --- PublicDoctorSlotsGet: Public GET endpoint for viewing a doctor's available slots ---
  PublicDoctorSlotsGet:
    Type: AWS::ApiGateway::Method
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_59
            comment: Public read-only doctor discovery and free-seat lookup is required before patient login.
    Properties:
      RestApiId: !Ref AuthRestApi
      ResourceId: !Ref PublicDoctorSlots
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PatientDomainLambda.Arn}/invocations
  # Milestone 5 API resources.
  AppointmentsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthRestApi
      ParentId: !GetAtt AuthRestApi.RootResourceId
      PathPart: appointments
  AppointmentIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthRestApi
      ParentId: !Ref AppointmentsResource
      PathPart: '{appointmentId}'
  PatientRefundsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthRestApi
      ParentId: !Ref PatientMeResource
      PathPart: refunds
  DoctorMySlotsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthRestApi
      ParentId: !Ref DoctorMe
      PathPart: slots
  DoctorMySlotIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthRestApi
      ParentId: !Ref DoctorMySlotsResource
      PathPart: '{slotId}'
  DoctorAppointmentsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthRestApi
      ParentId: !Ref DoctorMe
      PathPart: appointments
  DoctorAppointmentIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthRestApi
      ParentId: !Ref DoctorAppointmentsResource
      PathPart: '{appointmentId}'
  DoctorAppointmentOutcomeResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthRestApi
      ParentId: !Ref DoctorAppointmentIdResource
      PathPart: outcome

  AppointmentsPost:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AuthRestApi
      ResourceId: !Ref AppointmentsResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AppointmentApiLambda.Arn}/invocations
  AppointmentsGet:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AuthRestApi
      ResourceId: !Ref AppointmentsResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AppointmentApiLambda.Arn}/invocations
  AppointmentDetailGet:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AuthRestApi
      ResourceId: !Ref AppointmentIdResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AppointmentApiLambda.Arn}/invocations
  AppointmentCancelDelete:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AuthRestApi
      ResourceId: !Ref AppointmentIdResource
      HttpMethod: DELETE
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AppointmentApiLambda.Arn}/invocations
  PatientRefundsGet:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AuthRestApi
      ResourceId: !Ref PatientRefundsResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AppointmentApiLambda.Arn}/invocations
  DoctorSlotCancelDelete:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AuthRestApi
      ResourceId: !Ref DoctorMySlotIdResource
      HttpMethod: DELETE
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AppointmentApiLambda.Arn}/invocations
  DoctorAppointmentsGet:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AuthRestApi
      ResourceId: !Ref DoctorAppointmentsResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AppointmentApiLambda.Arn}/invocations
  DoctorAppointmentOutcomePost:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AuthRestApi
      ResourceId: !Ref DoctorAppointmentOutcomeResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AppointmentApiLambda.Arn}/invocations
  AppointmentApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AppointmentApiLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${AuthRestApi}/*/*/*

  # --- PatientDomainInvokePermission: Allows API Gateway to invoke the patient-domain Lambda ---
  PatientDomainInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PatientDomainLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${AuthRestApi}/*/*/*

  # --- AuthDeployment: Deploys the authentication API methods ---
  AuthDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - DoctorRegisterMethod
      - SpecializationsGet
      - PatientRegisterMethod
      - DoctorLoginMethod
      - PatientLoginMethod
      - RefreshMethod
      - LogoutMethod
      - DoctorCheckMethod
    Properties:
      RestApiId: !Ref AuthRestApi
      Description: !Sub Authentication API deployment ${CodeVersion}

  # --- DoctorDomainDeploymentMilestone4V1: Deploys doctor, patient and public discovery API methods ---
  DoctorDomainDeploymentMilestone4V1: 
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - AuthDeployment
      - SpecializationsGet
      - DoctorMeGet
      - DoctorMePut
      - DoctorPhotoPost
      - DoctorPhotoGet
      - DoctorConsultGet
      - DoctorConsultPost
      - DoctorConsultPut
      - DoctorConsultDelete
      - DoctorAvailabilityGet
      - DoctorAvailabilityPut
      - DoctorAvailabilityPost
      - DoctorAvailabilityEntryPut
      - DoctorAvailabilityEntryDelete
      - DoctorBlackoutsGet
      - DoctorBlackoutsPost
      - DoctorBlackoutsDelete
      - DoctorScheduleGet
      - PatientMeRead
      - PatientMeUpdate
      - PatientMeDelete
      - DoctorDiscoveryGet
      - PublicDoctorGet
      - PublicDoctorSlotsGet
      - AppointmentsPost
      - AppointmentsGet
      - AppointmentDetailGet
      - AppointmentCancelDelete
      - PatientRefundsGet
      - DoctorSlotCancelDelete
      - DoctorAppointmentsGet
      - DoctorAppointmentOutcomePost
    Properties:
      RestApiId: !Ref AuthRestApi
      Description: !Sub Doctor domain API deployment with photo GET ${CodeVersion}

  # --- AuthApiAccessLogGroup: Stores API Gateway access logs ---
  AuthApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: CloudWatch Logs provides encryption at rest by default; project policy does not provision customer-managed KMS keys.
    Properties:
      LogGroupName: !Sub /aws/apigateway/medislot-${Environment}-auth-access
      RetentionInDays: 14

  # UPDATED: AuthStage waits for ApiGatewayAccount.

  # --- AuthStage: Publishes the API deployment with tracing, access logging and throttling ---
  AuthStage:
    Type: AWS::ApiGateway::Stage
    DependsOn:
      - ApiGatewayAccount
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_120
            comment: Authentication and token responses must not be cached; throttling and logging are enabled.
    Properties:
      RestApiId: !Ref AuthRestApi
      DeploymentId: !Ref DoctorDomainDeploymentMilestone4V1
      StageName: !Ref Environment
      TracingEnabled: true
      AccessLogSetting:
        DestinationArn: !GetAtt AuthApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","route":"$context.resourcePath","status":"$context.status","latency":"$context.responseLatency"}'
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 10

  # --- AuthUnauthorizedResponse: Defines the standard JSON response for unauthorized API requests ---
  AuthUnauthorizedResponse:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref AuthRestApi
      ResponseType: UNAUTHORIZED
      StatusCode: '401'
      ResponseTemplates:
        application/json: '{"error":"Unauthorized"}'

# =====================================================
# OUTPUTS
# =====================================================

Outputs:

  # --- DBInitLambdaArn: Exports the database initialization Lambda ARN ---
  DBInitLambdaArn:
    Description: Database initialization Lambda ARN
    Value: !GetAtt DBInitLambda.Arn
    Export:
      Name: !Sub medislot-${Environment}-DBInitLambdaArn

  # --- AuthApiBaseUrl: Exports the API Gateway base URL for this environment ---
  AuthApiBaseUrl:
    Description: Authentication API base URL
    Value: !Sub https://${AuthRestApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
    Export:
      Name: !Sub medislot-${Environment}-AuthApiBaseUrl

  # --- DoctorRegisterLambdaArn: Exports the doctor registration Lambda ARN ---
  DoctorRegisterLambdaArn:
    Value: !GetAtt DoctorRegisterLambda.Arn
    Export:
      Name: !Sub medislot-${Environment}-DoctorRegisterLambdaArn

  # --- PatientRegisterLambdaArn: Exports the patient registration Lambda ARN ---
  PatientRegisterLambdaArn:
    Value: !GetAtt PatientRegisterLambda.Arn
    Export:
      Name: !Sub medislot-${Environment}-PatientRegisterLambdaArn

  # --- LoginLambdaArn: Exports the login Lambda ARN ---
  LoginLambdaArn:
    Value: !GetAtt LoginLambda.Arn
    Export:
      Name: !Sub medislot-${Environment}-LoginLambdaArn

  # --- TokenLambdaArn: Exports the token management Lambda ARN ---
  TokenLambdaArn:
    Value: !GetAtt TokenLambda.Arn
    Export:
      Name: !Sub medislot-${Environment}-TokenLambdaArn

  # --- AuthorizerLambdaArn: Exports the JWT authorizer Lambda ARN ---
  AuthorizerLambdaArn:
    Value: !GetAtt AuthorizerLambda.Arn
    Export:
      Name: !Sub medislot-${Environment}-AuthorizerLambdaArn

  # --- AuthTestLambdaArn: Exports the authentication test Lambda ARN ---
  AuthTestLambdaArn:
    Value: !GetAtt AuthTestLambda.Arn
    Export:
      Name: !Sub medislot-${Environment}-AuthTestLambdaArn
  # --- DoctorDashboardUrl: Provides the doctor dashboard login URL ---
  DoctorDashboardUrl:
    Description: HTTP-only first version; configure HTTPS before production use
    Value: !Sub http://${DoctorDashboardInstance.PublicDnsName}/doctor/login
