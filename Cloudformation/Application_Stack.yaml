      Timeout: 30
      MemorySize: 256
      DeadLetterConfig:
        TargetArn:
          Fn::ImportValue: !Sub medislot-${Environment}-AppointmentApiDeadLetterQueueArn
      KmsKeyArn: !Sub arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/lambda
      ReservedConcurrentExecutions: 20
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: !Sub medislot-${Environment}-LambdaSecurityGroupId
        SubnetIds:
          - Fn::ImportValue: !Sub medislot-${Environment}-PrivateSubnetAId
          - Fn::ImportValue: !Sub medislot-${Environment}-PrivateSubnetBId
      Environment:
        Variables:
          SLOTS_TABLE: !Sub medislot-${Environment}-slots
          IDEMPOTENCY_TABLE: !Sub medislot-${Environment}-idempotency
          REFUND_POLICY_PARAM: !Sub /medislot/${Environment}/appointments/refund-policy
          EVENT_BUS_NAME: !Sub medislot-${Environment}-appointments
          ENVIRONMENT: !Ref Environment
          DB_HOST:
