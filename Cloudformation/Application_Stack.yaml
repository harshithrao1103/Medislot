AWSTemplateFormatVersion: '2010-09-09'

Description: MediSlot Application Infrastructure

Parameters:

  Environment:
    Type: String
    AllowedValues:
      - dev
      - staging
      - prod

  ArtifactBucketName:
    Type: String
    Description: Existing S3 artifacts bucket name

  CodeVersion:
    Type: String
    Description: Git commit SHA for Lambda packages

Resources:

  # =====================================================
  # 1. DATABASE INITIALIZATION LAMBDA
  # =====================================================

  DBInitLambda:
    Type: AWS::Lambda::Function
    Properties:

      FunctionName: !Sub medislot-${Environment}-db-init

      Runtime: python3.12
      Handler: db_init_lambda.lambda_handler

      Role:
        Fn::ImportValue:
          !Sub medislot-${Environment}-DBInitLambdaExecutionRoleArn

      Code:
        S3Bucket: !Ref ArtifactBucketName
        S3Key: !Sub lambda/db_init/${CodeVersion}.zip

      Timeout: 60
      MemorySize: 256

      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue:
              !Sub medislot-${Environment}-LambdaSecurityGroupId

        SubnetIds:
          - Fn::ImportValue:
              !Sub medislot-${Environment}-PrivateSubnetAId

          - Fn::ImportValue:
              !Sub medislot-${Environment}-PrivateSubnetBId

      Environment:
        Variables:

          DB_HOST:
            Fn::ImportValue:
              !Sub medislot-${Environment}-DBEndpoint

          DB_PORT:
            Fn::ImportValue:
              !Sub medislot-${Environment}-DBPort

          DB_NAME:
            Fn::ImportValue:
              !Sub medislot-${Environment}-DBName

          DB_SECRET_ARN:
            Fn::ImportValue:
              !Sub medislot-${Environment}-DBMasterSecretArn

      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

Outputs:

  DBInitLambdaArn:
    Description: Database initialization Lambda ARN
    Value: !GetAtt DBInitLambda.Arn
    Export:
      Name: !Sub medislot-${Environment}-DBInitLambdaArn