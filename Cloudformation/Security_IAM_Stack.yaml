  # EC2 first-version Flask doctor dashboard; no database credentials on EC2.
  DoctorDashboardInstance:
    Type: AWS::EC2::Instance
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_88
            comment: Development dashboard requires a public IP; ingress is restricted by DashboardAllowedCidr. Not approved for production or real credentials.
    Properties:
      ImageId: !Ref DoctorDashboardAmi
      InstanceType: t2.micro
      IamInstanceProfile:
        Fn::ImportValue: !Sub medislot-${Environment}-DoctorDashboardInstanceProfileName
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: true
          SubnetId:
            Fn::ImportValue: !Sub medislot-${Environment}-PublicSubnetId
          GroupSet:
            - Fn::ImportValue: !Sub medislot-${Environment}-DoctorDashboardSecurityGroupId
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 12
            VolumeType: gp3
            Encrypted: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y python3 python3-pip unzip
          mkdir -p /opt/medislot /var/lib/medislot/sessions
          aws s3 cp s3://${ArtifactBucketName}/dashboard/${CodeVersion}.zip /tmp/medislot-dashboard.zip --region ${AWS::Region}
          unzip -o /tmp/medislot-dashboard.zip -d /opt/medislot
          python3 -m venv /opt/medislot/venv
          /opt/medislot/venv/bin/pip install -r /opt/medislot/requirements.txt
          chmod 700 /var/lib/medislot/sessions
          cat > /etc/medislot.env <<'ENVFILE'
          MEDISLOT_API_BASE_URL=https://${AuthRestApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
          ENVFILE
          printf 'FLASK_SECRET_KEY=%s\n' "$(python3 -c 'import secrets; print(secrets.token_hex(32))')" >> /etc/medislot.env
          chmod 600 /etc/medislot.env
          cat > /etc/systemd/system/medislot-doctor.service <<'SERVICE'
          [Unit]
          Description=MediSlot Doctor Dashboard
          After=network-online.target
          [Service]
          Type=simple
          User=root
          WorkingDirectory=/opt/medislot
          EnvironmentFile=/etc/medislot.env
          ExecStart=/opt/medislot/venv/bin/gunicorn -b 0.0.0.0:80 -w 2 app:app
          Restart=always
          RestartSec=5
          [Install]
          WantedBy=multi-user.target
          SERVICE
          systemctl daemon-reload
          systemctl enable --now medislot-doctor
      Tags:
        - Key: Name
          Value: !Sub medislot-${Environment}-doctor-dashboard
        - Key: Project
          Value: MediSlot

  AuthDeployment:
