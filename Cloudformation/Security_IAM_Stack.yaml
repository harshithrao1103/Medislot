  SlotMaterialiserLambda:
    Type: AWS::Lambda::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_173
            comment: Development Lambda uses AWS-managed environment encryption; no customer-managed KMS key provisioned.
          - id: CKV_AWS_116
            comment: Scheduled invocation uses EventBridge Scheduler retry policy; dedicated failure destination is a future hardening task.
    Properties:
      FunctionName: !Sub medislot-${Environment}-slot-materialiser
      Runtime: python3.12
      Handler: slot_materialiser_lambda.lambda_handler
      Role:
        Fn::ImportValue: !Sub medislot-${Environment}-SlotMaterialiserRoleArn
      Code:
        S3Bucket: !Ref ArtifactBucketName
        S3Key: !Sub lambda/slot_materialiser/${CodeVersion}.zip
      Timeout: 300
      MemorySize: 256
      ReservedConcurrentExecutions: 1
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: !Sub medislot-${Environment}-LambdaSecurityGroupId
        SubnetIds:
          - Fn::ImportValue: !Sub medislot-${Environment}-PrivateSubnetAId
          - Fn::ImportValue: !Sub medislot-${Environment}-PrivateSubnetBId
      Environment:
        Variables:
          SLOTS_TABLE:
            Fn::ImportValue: !Sub medislot-${Environment}-SlotInventoryTableName
          BOOKING_WINDOW_PARAM: !Ref BookingWindowDaysParameter
          DB_HOST:
            Fn::ImportValue: !Sub medislot-${Environment}-DBEndpoint
          DB_PORT:
            Fn::ImportValue: !Sub medislot-${Environment}-DBPort
          DB_NAME:
            Fn::ImportValue: !Sub medislot-${Environment}-DBName
          DB_SECRET_ARN:
            Fn::ImportValue: !Sub medislot-${Environment}-DBMasterSecretArn
  BookingWindowDaysParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /medislot/${Environment}/slots/booking-window-days
      Type: String
      Value: '30'
      Description: Rolling booking window length in days

  DailySlotMaterialiserSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub 'medislot-${Environment}-daily-slot-materialiser'
      ScheduleExpression: 'cron(30 0 * * ? *)'
      ScheduleExpressionTimezone: Asia/Kolkata
      FlexibleTimeWindow:
        Mode: 'OFF'
      State: ENABLED
      Target:
        Arn: !GetAtt SlotMaterialiserLambda.Arn
        RoleArn: !GetAtt MaterialiserSchedulerRole.Arn
        Input: '{}'

  MaterialiserSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'medislot-${Environment}-materialiser-scheduler-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeSlotMaterialiser
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt SlotMaterialiserLambda.Arn
