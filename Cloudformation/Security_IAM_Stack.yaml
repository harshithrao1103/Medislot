      - PatientRegisterMethod
      - DoctorLoginMethod
      - PatientLoginMethod
      - RefreshMethod
      - LogoutMethod
      - DoctorCheckMethod
    Properties:
      RestApiId: !Ref AuthRestApi
      Description: !Sub Authentication API deployment ${CodeVersion}

  DoctorDomainDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - AuthDeployment
      - DoctorMeGet
      - DoctorMePut
      - DoctorPhotoPost
      - DoctorConsultGet
      - DoctorConsultPost
      - DoctorConsultPut
      - DoctorConsultDelete
      - DoctorAvailabilityGet
      - DoctorAvailabilityPut
      - DoctorBlackoutsGet
      - DoctorBlackoutsPost
      - DoctorBlackoutsDelete
      - DoctorScheduleGet
    Properties:
      RestApiId: !Ref AuthRestApi
      Description: !Sub Doctor domain API deployment ${CodeVersion}

  AuthApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: CloudWatch Logs provides encryption at rest by default; project policy does not provision customer-managed KMS keys.
    Properties:
      LogGroupName: !Sub /aws/apigateway/medislot-${Environment}-auth-access
      RetentionInDays: 14

  # UPDATED: AuthStage waits for ApiGatewayAccount.

  AuthStage:
    Type: AWS::ApiGateway::Stage
    DependsOn:
      - ApiGatewayAccount
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_120
            comment: Authentication and token responses must not be cached; throttling and logging are enabled.
    Properties:
      RestApiId: !Ref AuthRestApi
      DeploymentId: !Ref DoctorDomainDeployment
      StageName: !Ref Environment
      TracingEnabled: true
      AccessLogSetting:
        DestinationArn: !GetAtt AuthApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","route":"$context.resourcePath","status":"$context.status","latency":"$context.responseLatency"}'
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 10

  AuthUnauthorizedResponse:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref AuthRestApi
      ResponseType: UNAUTHORIZED
      StatusCode: '401'
      ResponseTemplates:
        application/json: '{"error":"Unauthorized"}'

