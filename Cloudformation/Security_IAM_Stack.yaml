AWSTemplateFormatVersion: '2010-09-09'

Description: >
  MediSlot Security Infrastructure -
  Security Groups, SSM Endpoint and Lambda IAM Roles.

# =====================================================
# PARAMETERS
# =====================================================

Parameters:

  Environment:
    Type: String
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment environment

  VpcCIDR:
    Type: String
    Description: CIDR block of the existing MediSlot VPC

# =====================================================
# RESOURCES
# =====================================================

Resources:

  # =====================================================
  # 1. LAMBDA SECURITY GROUP
  # =====================================================

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Network access for MediSlot Lambda functions

      VpcId:
        Fn::ImportValue:
          Fn::Sub: medislot-${Environment}-VpcId

      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          CidrIp: !Ref VpcCIDR
          Description: MySQL connections within MediSlot VPC

        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS to reachable AWS service endpoints

      Tags:
        - Key: Name
          Value: !Sub medislot-${Environment}-lambda-sg
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # =====================================================
  # 2. RDS MYSQL SECURITY GROUP
  # =====================================================

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: MySQL access from MediSlot Lambda functions

      VpcId:
        Fn::ImportValue:
          Fn::Sub: medislot-${Environment}-VpcId

      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
          Description: Allow MySQL from Lambda Security Group

      SecurityGroupEgress: []

      Tags:
        - Key: Name
          Value: !Sub medislot-${Environment}-rds-sg
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # =====================================================
  # 3. SSM ENDPOINT SECURITY GROUP
  # =====================================================

  SSMEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTPS access to SSM endpoint from Lambda

      VpcId:
        Fn::ImportValue:
          Fn::Sub: medislot-${Environment}-VpcId

      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
          Description: HTTPS from MediSlot Lambda

      SecurityGroupEgress: []

      Tags:
        - Key: Name
          Value: !Sub medislot-${Environment}-ssm-endpoint-sg
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # =====================================================
  # 4. SSM INTERFACE VPC ENDPOINT
  # =====================================================

  SSMInterfaceEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId:
        Fn::ImportValue:
          Fn::Sub: medislot-${Environment}-VpcId

      ServiceName: !Sub com.amazonaws.${AWS::Region}.ssm

      VpcEndpointType: Interface
      PrivateDnsEnabled: true

      SubnetIds:
        - Fn::ImportValue:
            Fn::Sub: medislot-${Environment}-PrivateSubnetAId

        - Fn::ImportValue:
            Fn::Sub: medislot-${Environment}-PrivateSubnetBId

      SecurityGroupIds:
        - !Ref SSMEndpointSecurityGroup

      Tags:
        - Key: Name
          Value: !Sub medislot-${Environment}-ssm-endpoint
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # =====================================================
  # 5. DATABASE INITIALIZATION LAMBDA ROLE
  # =====================================================

  DBInitLambdaExecutionRole:
    Type: AWS::IAM::Role
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_111
            comment: Lambda ENI management requires EC2 network-interface permissions on wildcard resources; review role scope and AWS condition keys.
    Properties:
      RoleName: !Sub medislot-${Environment}-db-init-lambda-role

      Description: Execution role for database initialization Lambda

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:
        - PolicyName: DBInitLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Sid: ReadRDSMasterSecret
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rds!db-*

              - Sid: DecryptRDSSecret
                Effect: Allow
                Action:
                  - kms:Decrypt
                Resource:
                  - !Sub arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/3437e1a5-332d-49a7-a5f6-73cb084d0070
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub secretsmanager.${AWS::Region}.amazonaws.com

              - Sid: CreateCloudWatchLogGroup
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                Resource: "*"

              - Sid: WriteCloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/medislot-${Environment}-db-init:*

              - Sid: LambdaVPCNetworkAccess
                Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: "*"

      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # =====================================================
  # 6. DOCTOR REGISTRATION LAMBDA ROLE
  # =====================================================

  DoctorRegisterLambdaExecutionRole:
    Type: AWS::IAM::Role
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_111
            comment: VPC Lambda ENI creation requires wildcard EC2 permissions; permissions are limited to network-interface actions.
    Properties:
      RoleName: !Sub medislot-${Environment}-doctor-register-lambda-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

      Policies:
        - PolicyName: DoctorRegisterLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Sid: ReadRDSCredentials
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rds!db-*

              - Sid: DecryptRDSSecret
                Effect: Allow
                Action:
                  - kms:Decrypt
                Resource:
                  - !Sub arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/3437e1a5-332d-49a7-a5f6-73cb084d0070
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub secretsmanager.${AWS::Region}.amazonaws.com

              - Sid: ReadRegistrationConfiguration
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${Environment}/auth/*

              - Sid: WriteLambdaLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/medislot-${Environment}-doctor-register:*

              - Sid: LambdaVPCNetworkAccess
                Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: "*"

      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # =====================================================
  # 7. PATIENT REGISTRATION LAMBDA ROLE
  # =====================================================

  PatientRegisterLambdaExecutionRole:
    Type: AWS::IAM::Role
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_111
            comment: VPC Lambda ENI creation requires wildcard EC2 permissions; permissions are limited to network-interface actions.
    Properties:
      RoleName: !Sub medislot-${Environment}-patient-register-lambda-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

      Policies:
        - PolicyName: PatientRegisterLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Sid: ReadRDSCredentials
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rds!db-*

              - Sid: DecryptRDSSecret
                Effect: Allow
                Action:
                  - kms:Decrypt
                Resource:
                  - !Sub arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/3437e1a5-332d-49a7-a5f6-73cb084d0070
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub secretsmanager.${AWS::Region}.amazonaws.com

              - Sid: ReadRegistrationConfiguration
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${Environment}/auth/*

              - Sid: WriteLambdaLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/medislot-${Environment}-patient-register:*

              - Sid: LambdaVPCNetworkAccess
                Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: "*"

      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # =====================================================
  # 8. LOGIN LAMBDA ROLE
  # =====================================================

  LoginLambdaExecutionRole:
    Type: AWS::IAM::Role
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_111
            comment: VPC Lambda ENI creation requires wildcard EC2 permissions; permissions are limited to network-interface actions.
    Properties:
      RoleName: !Sub medislot-${Environment}-login-lambda-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

      Policies:
        - PolicyName: LoginLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Sid: ReadRDSCredentials
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rds!db-*

              - Sid: DecryptRDSSecret
                Effect: Allow
                Action:
                  - kms:Decrypt
                Resource:
                  - !Sub arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/3437e1a5-332d-49a7-a5f6-73cb084d0070
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub secretsmanager.${AWS::Region}.amazonaws.com

              - Sid: ReadJWTConfiguration
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${Environment}/auth/*

              - Sid: WriteRefreshTokens
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-refresh-tokens

              - Sid: WriteLambdaLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/medislot-${Environment}-login:*

              - Sid: LambdaVPCNetworkAccess
                Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: "*"

      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # =====================================================
  # 9. TOKEN MANAGEMENT LAMBDA ROLE
  # =====================================================

  TokenLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-token-lambda-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

      Policies:
        - PolicyName: TokenLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Sid: ReadJWTConfiguration
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${Environment}/auth/*

              - Sid: ManageRefreshTokens
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-refresh-tokens

              - Sid: ManageRevokedJWTs
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-revoked-jwts

              - Sid: WriteLambdaLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/medislot-${Environment}-token:*

      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # =====================================================
  # 10. LAMBDA AUTHORIZER ROLE
  # =====================================================

  AuthorizerLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-authorizer-lambda-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

      Policies:
        - PolicyName: AuthorizerLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Sid: ReadJWTConfiguration
                Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${Environment}/auth/*

              - Sid: ReadRevokedJWTs
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/medislot-${Environment}-revoked-jwts

              - Sid: WriteLambdaLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/medislot-${Environment}-authorizer:*

      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # =====================================================
  # 11. AUTH TEST LAMBDA ROLE
  # =====================================================

  AuthTestLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-auth-test-lambda-role

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

      Policies:
        - PolicyName: AuthTestLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:

              - Sid: WriteLambdaLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/medislot-${Environment}-auth-test:*

      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub medislot-${Environment}-apigateway-cloudwatch-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

# =====================================================
# OUTPUTS
# =====================================================

Outputs:

  LambdaSecurityGroupId:
    Description: Lambda Security Group ID
    Value: !Ref LambdaSecurityGroup
    Export:
      Name: !Sub medislot-${Environment}-LambdaSecurityGroupId

  RDSSecurityGroupId:
    Description: RDS MySQL Security Group ID
    Value: !Ref RDSSecurityGroup
    Export:
      Name: !Sub medislot-${Environment}-RDSSecurityGroupId

  SSMEndpointSecurityGroupId:
    Description: SSM Endpoint Security Group ID
    Value: !Ref SSMEndpointSecurityGroup
    Export:
      Name: !Sub medislot-${Environment}-SSMEndpointSecurityGroupId

  SSMEndpointId:
    Description: SSM Interface VPC Endpoint ID
    Value: !Ref SSMInterfaceEndpoint
    Export:
      Name: !Sub medislot-${Environment}-SSMEndpointId

  DBInitLambdaExecutionRoleArn:
    Description: IAM execution role ARN for database initialization Lambda
    Value: !GetAtt DBInitLambdaExecutionRole.Arn
    Export:
      Name: !Sub medislot-${Environment}-DBInitLambdaExecutionRoleArn

  DoctorRegisterLambdaExecutionRoleArn:
    Description: IAM execution role ARN for doctor registration Lambda
    Value: !GetAtt DoctorRegisterLambdaExecutionRole.Arn
    Export:
      Name: !Sub medislot-${Environment}-DoctorRegisterLambdaExecutionRoleArn

  PatientRegisterLambdaExecutionRoleArn:
    Description: IAM execution role ARN for patient registration Lambda
    Value: !GetAtt PatientRegisterLambdaExecutionRole.Arn
    Export:
      Name: !Sub medislot-${Environment}-PatientRegisterLambdaExecutionRoleArn

  LoginLambdaExecutionRoleArn:
    Description: IAM execution role ARN for login Lambda
    Value: !GetAtt LoginLambdaExecutionRole.Arn
    Export:
      Name: !Sub medislot-${Environment}-LoginLambdaExecutionRoleArn

  TokenLambdaExecutionRoleArn:
    Description: IAM execution role ARN for token management Lambda
    Value: !GetAtt TokenLambdaExecutionRole.Arn
    Export:
      Name: !Sub medislot-${Environment}-TokenLambdaExecutionRoleArn

  AuthorizerLambdaExecutionRoleArn:
    Description: IAM execution role ARN for Lambda Authorizer
    Value: !GetAtt AuthorizerLambdaExecutionRole.Arn
    Export:
      Name: !Sub medislot-${Environment}-AuthorizerLambdaExecutionRoleArn

  AuthTestLambdaExecutionRoleArn:
    Description: IAM execution role ARN for authentication test Lambda
    Value: !GetAtt AuthTestLambdaExecutionRole.Arn
    Export:
      Name: !Sub medislot-${Environment}-AuthTestLambdaExecutionRoleArn


  ApiGatewayCloudWatchRoleArn:
    Description: IAM role ARN for API Gateway CloudWatch logging
    Value: !GetAtt ApiGatewayCloudWatchRole.Arn
    Export:
      Name: !Sub medislot-${Environment}-ApiGatewayCloudWatchRoleArn