AWSTemplateFormatVersion: '2010-09-09'
Description: MediSlot Application Infrastructure

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - staging
      - prod

  ArtifactBucketName:
    Type: String
    Description: Existing S3 artifacts bucket name

  DoctorDashboardAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

  CodeVersion:
    Type: String
    Description: Git commit SHA for Lambda packages

Resources:

  # =====================================================
  # 1. DATABASE INITIALIZATION LAMBDA
  # =====================================================

  DBInitLambda:
    Type: AWS::Lambda::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_115
            comment: Development environment uses shared Lambda concurrency because account quota cannot support per-function reservations.
          - id: CKV_AWS_173
            comment: Lambda environment values are encrypted at rest with the AWS-managed Lambda key; customer-managed key is outside project key policy.
          - id: CKV_AWS_116
            comment: This Lambda is invoked synchronously; Lambda async DLQ does not apply to synchronous API Gateway invocations.
    Properties:
      FunctionName: !Sub medislot-${Environment}-db-init
      Runtime: python3.12
      Handler: db_init_lambda.lambda_handler
      Role:
        Fn::ImportValue: !Sub medislot-${Environment}-DBInitLambdaExecutionRoleArn
      Code:
        S3Bucket: !Ref ArtifactBucketName
        S3Key: !Sub lambda/db_init/${CodeVersion}.zip
      Timeout: 60
      MemorySize: 256
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: !Sub medislot-${Environment}-LambdaSecurityGroupId
        SubnetIds:
          - Fn::ImportValue: !Sub medislot-${Environment}-PrivateSubnetAId
          - Fn::ImportValue: !Sub medislot-${Environment}-PrivateSubnetBId
      Environment:
        Variables:
          DB_HOST:
            Fn::ImportValue: !Sub medislot-${Environment}-DBEndpoint
          DB_PORT:
            Fn::ImportValue: !Sub medislot-${Environment}-DBPort
          DB_NAME:
            Fn::ImportValue: !Sub medislot-${Environment}-DBName
          DB_SECRET_ARN:
            Fn::ImportValue: !Sub medislot-${Environment}-DBMasterSecretArn
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # =====================================================
  # 2. AUTHENTICATION LAMBDAS AND LOG GROUPS
  # =====================================================

  DoctorRegisterLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: CloudWatch Logs provides encryption at rest by default; project policy does not provision customer-managed KMS keys.
    Properties:
      LogGroupName: !Sub /aws/lambda/medislot-${Environment}-doctor-register
      RetentionInDays: 14

  DoctorRegisterLambda:
    Type: AWS::Lambda::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_115
            comment: Development environment uses shared Lambda concurrency because account quota cannot support per-function reservations.
          - id: CKV_AWS_173
            comment: Lambda environment values are encrypted at rest with the AWS-managed Lambda key; customer-managed key is outside project key policy.
          - id: CKV_AWS_116
            comment: This Lambda is invoked synchronously; Lambda async DLQ does not apply to synchronous API Gateway invocations.
    Properties:
      FunctionName: !Sub medislot-${Environment}-doctor-register
      Runtime: python3.12
      Handler: doctor_register_lambda.lambda_handler
      Role:
        Fn::ImportValue: !Sub medislot-${Environment}-DoctorRegisterLambdaExecutionRoleArn
      Code:
        S3Bucket: !Ref ArtifactBucketName
        S3Key: !Sub lambda/doctor_register/${CodeVersion}.zip
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          AUTH_SSM_PREFIX: !Sub /medislot/${Environment}/auth
          REFRESH_TABLE: !Sub medislot-${Environment}-refresh-tokens
          REVOKED_TABLE: !Sub medislot-${Environment}-revoked-jwts
          DB_HOST:
            Fn::ImportValue: !Sub medislot-${Environment}-DBEndpoint
          DB_PORT:
            Fn::ImportValue: !Sub medislot-${Environment}-DBPort
          DB_NAME:
            Fn::ImportValue: !Sub medislot-${Environment}-DBName
          DB_SECRET_ARN:
            Fn::ImportValue: !Sub medislot-${Environment}-DBMasterSecretArn
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: !Sub medislot-${Environment}-LambdaSecurityGroupId
        SubnetIds:
          - Fn::ImportValue: !Sub medislot-${Environment}-PrivateSubnetAId
          - Fn::ImportValue: !Sub medislot-${Environment}-PrivateSubnetBId
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  PatientRegisterLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: CloudWatch Logs provides encryption at rest by default; project policy does not provision customer-managed KMS keys.
    Properties:
      LogGroupName: !Sub /aws/lambda/medislot-${Environment}-patient-register
      RetentionInDays: 14

  PatientRegisterLambda:
    Type: AWS::Lambda::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_115
            comment: Development environment uses shared Lambda concurrency because account quota cannot support per-function reservations.
          - id: CKV_AWS_173
            comment: Lambda environment values are encrypted at rest with the AWS-managed Lambda key; customer-managed key is outside project key policy.
          - id: CKV_AWS_116
            comment: This Lambda is invoked synchronously; Lambda async DLQ does not apply to synchronous API Gateway invocations.
    Properties:
      FunctionName: !Sub medislot-${Environment}-patient-register
      Runtime: python3.12
      Handler: patient_register_lambda.lambda_handler
      Role:
        Fn::ImportValue: !Sub medislot-${Environment}-PatientRegisterLambdaExecutionRoleArn
      Code:
        S3Bucket: !Ref ArtifactBucketName
        S3Key: !Sub lambda/patient_register/${CodeVersion}.zip
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          AUTH_SSM_PREFIX: !Sub /medislot/${Environment}/auth
          REFRESH_TABLE: !Sub medislot-${Environment}-refresh-tokens
          REVOKED_TABLE: !Sub medislot-${Environment}-revoked-jwts
          DB_HOST:
            Fn::ImportValue: !Sub medislot-${Environment}-DBEndpoint
          DB_PORT:
            Fn::ImportValue: !Sub medislot-${Environment}-DBPort
          DB_NAME:
            Fn::ImportValue: !Sub medislot-${Environment}-DBName
          DB_SECRET_ARN:
            Fn::ImportValue: !Sub medislot-${Environment}-DBMasterSecretArn
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: !Sub medislot-${Environment}-LambdaSecurityGroupId
        SubnetIds:
          - Fn::ImportValue: !Sub medislot-${Environment}-PrivateSubnetAId
          - Fn::ImportValue: !Sub medislot-${Environment}-PrivateSubnetBId
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  LoginLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: CloudWatch Logs provides encryption at rest by default; project policy does not provision customer-managed KMS keys.
    Properties:
      LogGroupName: !Sub /aws/lambda/medislot-${Environment}-login
      RetentionInDays: 14

  LoginLambda:
    Type: AWS::Lambda::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_115
            comment: Development environment uses shared Lambda concurrency because account quota cannot support per-function reservations.
          - id: CKV_AWS_173
            comment: Lambda environment values are encrypted at rest with the AWS-managed Lambda key; customer-managed key is outside project key policy.
          - id: CKV_AWS_116
            comment: This Lambda is invoked synchronously; Lambda async DLQ does not apply to synchronous API Gateway invocations.
    Properties:
      FunctionName: !Sub medislot-${Environment}-login
      Runtime: python3.12
      Handler: login_lambda.lambda_handler
      Role:
        Fn::ImportValue: !Sub medislot-${Environment}-LoginLambdaExecutionRoleArn
      Code:
        S3Bucket: !Ref ArtifactBucketName
        S3Key: !Sub lambda/login/${CodeVersion}.zip
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          AUTH_SSM_PREFIX: !Sub /medislot/${Environment}/auth
          REFRESH_TABLE: !Sub medislot-${Environment}-refresh-tokens
          REVOKED_TABLE: !Sub medislot-${Environment}-revoked-jwts
          DB_HOST:
            Fn::ImportValue: !Sub medislot-${Environment}-DBEndpoint
          DB_PORT:
            Fn::ImportValue: !Sub medislot-${Environment}-DBPort
          DB_NAME:
            Fn::ImportValue: !Sub medislot-${Environment}-DBName
          DB_SECRET_ARN:
            Fn::ImportValue: !Sub medislot-${Environment}-DBMasterSecretArn
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: !Sub medislot-${Environment}-LambdaSecurityGroupId
        SubnetIds:
          - Fn::ImportValue: !Sub medislot-${Environment}-PrivateSubnetAId
          - Fn::ImportValue: !Sub medislot-${Environment}-PrivateSubnetBId
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  TokenLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: CloudWatch Logs provides encryption at rest by default; project policy does not provision customer-managed KMS keys.
    Properties:
      LogGroupName: !Sub /aws/lambda/medislot-${Environment}-token
      RetentionInDays: 14

  TokenLambda:
    Type: AWS::Lambda::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_115
            comment: Development environment uses shared Lambda concurrency because account quota cannot support per-function reservations.
          - id: CKV_AWS_173
            comment: Lambda environment values are encrypted at rest with the AWS-managed Lambda key; customer-managed key is outside project key policy.
          - id: CKV_AWS_116
            comment: This Lambda is invoked synchronously; Lambda async DLQ does not apply to synchronous API Gateway invocations.
          - id: CKV_AWS_117
            comment: Function does not require RDS network access; keeping it outside the VPC preserves access to regional AWS APIs without extra endpoints.
    Properties:
      FunctionName: !Sub medislot-${Environment}-token
      Runtime: python3.12
      Handler: token_lambda.lambda_handler
      Role:
        Fn::ImportValue: !Sub medislot-${Environment}-TokenLambdaExecutionRoleArn
      Code:
        S3Bucket: !Ref ArtifactBucketName
        S3Key: !Sub lambda/token/${CodeVersion}.zip
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          AUTH_SSM_PREFIX: !Sub /medislot/${Environment}/auth
          REFRESH_TABLE: !Sub medislot-${Environment}-refresh-tokens
          REVOKED_TABLE: !Sub medislot-${Environment}-revoked-jwts
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  AuthorizerLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: CloudWatch Logs provides encryption at rest by default; project policy does not provision customer-managed KMS keys.
    Properties:
      LogGroupName: !Sub /aws/lambda/medislot-${Environment}-authorizer
      RetentionInDays: 14

  AuthorizerLambda:
    Type: AWS::Lambda::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_115
            comment: Development environment uses shared Lambda concurrency because account quota cannot support per-function reservations.
          - id: CKV_AWS_173
            comment: Lambda environment values are encrypted at rest with the AWS-managed Lambda key; customer-managed key is outside project key policy.
          - id: CKV_AWS_116
            comment: This Lambda is invoked synchronously; Lambda async DLQ does not apply to synchronous API Gateway invocations.
          - id: CKV_AWS_117
            comment: Function does not require RDS network access; keeping it outside the VPC preserves access to regional AWS APIs without extra endpoints.
    Properties:
      FunctionName: !Sub medislot-${Environment}-authorizer
      Runtime: python3.12
      Handler: authorizer_lambda.lambda_handler
      Role:
        Fn::ImportValue: !Sub medislot-${Environment}-AuthorizerLambdaExecutionRoleArn
      Code:
        S3Bucket: !Ref ArtifactBucketName
        S3Key: !Sub lambda/authorizer/${CodeVersion}.zip
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          AUTH_SSM_PREFIX: !Sub /medislot/${Environment}/auth
          REFRESH_TABLE: !Sub medislot-${Environment}-refresh-tokens
          REVOKED_TABLE: !Sub medislot-${Environment}-revoked-jwts
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  AuthTestLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: CloudWatch Logs provides encryption at rest by default; project policy does not provision customer-managed KMS keys.
    Properties:
      LogGroupName: !Sub /aws/lambda/medislot-${Environment}-auth-test
      RetentionInDays: 14

  AuthTestLambda:
    Type: AWS::Lambda::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_115
            comment: Development environment uses shared Lambda concurrency because account quota cannot support per-function reservations.
          - id: CKV_AWS_173
            comment: Lambda environment values are encrypted at rest with the AWS-managed Lambda key; customer-managed key is outside project key policy.
          - id: CKV_AWS_116
            comment: This Lambda is invoked synchronously; Lambda async DLQ does not apply to synchronous API Gateway invocations.
          - id: CKV_AWS_117
            comment: Function does not require RDS network access; keeping it outside the VPC preserves access to regional AWS APIs without extra endpoints.
    Properties:
      FunctionName: !Sub medislot-${Environment}-auth-test
      Runtime: python3.12
      Handler: auth_test_lambda.lambda_handler
      Role:
        Fn::ImportValue: !Sub medislot-${Environment}-AuthTestLambdaExecutionRoleArn
      Code:
        S3Bucket: !Ref ArtifactBucketName
        S3Key: !Sub lambda/auth_test/${CodeVersion}.zip
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          AUTH_SSM_PREFIX: !Sub /medislot/${Environment}/auth
          REFRESH_TABLE: !Sub medislot-${Environment}-refresh-tokens
          REVOKED_TABLE: !Sub medislot-${Environment}-revoked-jwts
      Tags:
        - Key: Project
          Value: MediSlot
        - Key: Environment
          Value: !Ref Environment

  # =====================================================
  # 3. API GATEWAY
  # =====================================================

  # NEW: Configure API Gateway to use the CloudWatch
  # IAM role created by the Security/IAM Stack.

  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn:
        Fn::ImportValue: !Sub medislot-${Environment}-ApiGatewayCloudWatchRoleArn

  AuthRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub medislot-${Environment}-auth-api
      EndpointConfiguration:
        Types: [REGIONAL]

  AuthResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthRestApi
      ParentId: !GetAtt AuthRestApi.RootResourceId
      PathPart: auth

  DoctorsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthRestApi
      ParentId: !Ref AuthResource
      PathPart: doctors

  PatientsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthRestApi
      ParentId: !Ref AuthResource
      PathPart: patients

  DoctorCheckResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthRestApi
      ParentId: !GetAtt AuthRestApi.RootResourceId
      PathPart: doctor-auth-check

  JwtAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: !Sub medislot-${Environment}-jwt-authorizer
      Type: TOKEN
      RestApiId: !Ref AuthRestApi
      IdentitySource: method.request.header.Authorization
      AuthorizerResultTtlInSeconds: 0
      AuthorizerUri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerLambda.Arn}/invocations

  AuthorizerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuthorizerLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${AuthRestApi}/authorizers/${JwtAuthorizer}

  DoctorRegisterResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthRestApi
      ParentId: !Ref DoctorsResource
      PathPart: register

  DoctorLoginResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthRestApi
      ParentId: !Ref DoctorsResource
      PathPart: login

  PatientRegisterResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthRestApi
      ParentId: !Ref PatientsResource
      PathPart: register

  PatientLoginResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthRestApi
      ParentId: !Ref PatientsResource
      PathPart: login

  RefreshResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthRestApi
      ParentId: !Ref AuthResource
      PathPart: refresh

  LogoutResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthRestApi
      ParentId: !Ref AuthResource
      PathPart: logout

  # =====================================================
  # 4. API GATEWAY METHODS AND PERMISSIONS
  # =====================================================

  DoctorRegisterMethod:
    Type: AWS::ApiGateway::Method
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_59
            comment: Public authentication bootstrap endpoint; request validation and application-level protections remain necessary; JWT is not available before login.
    Properties:
      RestApiId: !Ref AuthRestApi
      ResourceId: !Ref DoctorRegisterResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DoctorRegisterLambda.Arn}/invocations

  DoctorRegisterInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DoctorRegisterLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${AuthRestApi}/*/POST/*

  PatientRegisterMethod:
    Type: AWS::ApiGateway::Method
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_59
            comment: Public authentication bootstrap endpoint; request validation and application-level protections remain necessary; JWT is not available before login.
    Properties:
      RestApiId: !Ref AuthRestApi
      ResourceId: !Ref PatientRegisterResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PatientRegisterLambda.Arn}/invocations

  PatientRegisterInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PatientRegisterLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${AuthRestApi}/*/POST/*

  DoctorLoginMethod:
    Type: AWS::ApiGateway::Method
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_59
            comment: Public authentication bootstrap endpoint; request validation and application-level protections remain necessary; JWT is not available before login.
    Properties:
      RestApiId: !Ref AuthRestApi
      ResourceId: !Ref DoctorLoginResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LoginLambda.Arn}/invocations

  DoctorLoginInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LoginLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${AuthRestApi}/*/POST/*

  PatientLoginMethod:
    Type: AWS::ApiGateway::Method
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_59
            comment: Public authentication bootstrap endpoint; request validation and application-level protections remain necessary; JWT is not available before login.
    Properties:
      RestApiId: !Ref AuthRestApi
      ResourceId: !Ref PatientLoginResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LoginLambda.Arn}/invocations

  PatientLoginInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LoginLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${AuthRestApi}/*/POST/*

  RefreshMethod:
    Type: AWS::ApiGateway::Method
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_59
            comment: Public authentication bootstrap endpoint; request validation and application-level protections remain necessary; JWT is not available before login.
    Properties:
      RestApiId: !Ref AuthRestApi
      ResourceId: !Ref RefreshResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TokenLambda.Arn}/invocations

  RefreshInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TokenLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${AuthRestApi}/*/POST/*

  LogoutMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AuthRestApi
      ResourceId: !Ref LogoutResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TokenLambda.Arn}/invocations

  LogoutInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TokenLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${AuthRestApi}/*/POST/*

  DoctorCheckMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AuthRestApi
      ResourceId: !Ref DoctorCheckResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JwtAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthTestLambda.Arn}/invocations

  DoctorCheckInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuthTestLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${AuthRestApi}/*/GET/*

  # =====================================================
  # 5. API DEPLOYMENT AND LOGGING
  # =====================================================


  # Milestone 3 doctor domain; existing auth resources are unchanged.
  DoctorApiLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: Development log group uses AWS-managed encryption at rest; customer-managed KMS key not provisioned.
    Properties:
      LogGroupName: !Sub /aws/lambda/medislot-${Environment}-doctor-api
      RetentionInDays: 14
  SlotMaterialiserLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: Development log group uses AWS-managed encryption at rest; customer-managed KMS key not provisioned.
    Properties:
      LogGroupName: !Sub /aws/lambda/medislot-${Environment}-slot-materialiser
      RetentionInDays: 14
  DoctorApiLambda:
    Type: AWS::Lambda::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_115
            comment: Development doctor API uses shared concurrency to avoid reserving account concurrency quota.
          - id: CKV_AWS_173
            comment: Development Lambda uses AWS-managed environment encryption; no customer-managed KMS key provisioned.
          - id: CKV_AWS_116
            comment: Synchronous API Gateway invocation does not use Lambda async DLQ.
    Properties:
      FunctionName: !Sub medislot-${Environment}-doctor-api
      Runtime: python3.12
      Handler: doctor_api_lambda.lambda_handler
      Role:
        Fn::ImportValue: !Sub medislot-${Environment}-DoctorApiLambdaRoleArn
      Code:
        S3Bucket: !Ref ArtifactBucketName
        S3Key: !Sub lambda/doctor_api/${CodeVersion}.zip
      Timeout: 30
      MemorySize: 256
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: !Sub medislot-${Environment}-LambdaSecurityGroupId
        SubnetIds:
          - Fn::ImportValue: !Sub medislot-${Environment}-PrivateSubnetAId
          - Fn::ImportValue: !Sub medislot-${Environment}-PrivateSubnetBId
      Environment:
        Variables:
          PHOTO_BUCKET:
            Fn::ImportValue: !Sub medislot-${Environment}-ProfilePhotosBucketName
          SLOTS_TABLE:
            Fn::ImportValue: !Sub medislot-${Environment}-SlotInventoryTableName
          DB_HOST:
            Fn::ImportValue: !Sub medislot-${Environment}-DBEndpoint
          DB_PORT:
            Fn::ImportValue: !Sub medislot-${Environment}-DBPort
